<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suisse & 1914 — Révision</title>
<style>
  :root{
    --bg:#14161c;
    --bg2:#191c23;
    --panel:#20232c;
    --panel-hi:#262a35;
    --line:#2c303c;
    --ink:#eae6da;
    --muted:#8d90a0;
    --red:#a8382a;
    --red-bright:#c9503f;
    --gold:#c8a24a;
    --gold-soft:rgba(200,162,74,.16);
    --good:#5fa876;
    --bad:#c1554a;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold-soft);}

  /* ---------- Header ---------- */
  header.top{
    padding:22px 28px 0 28px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--bg2), var(--bg) 90%);
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:4px;
    background:linear-gradient(135deg,var(--red),var(--red-bright));
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--serif); font-weight:700; color:#fff; font-size:16px;
    flex:0 0 auto;
  }
  .brand h1{
    font-family:var(--serif);
    font-size:26px; font-weight:600; margin:0; letter-spacing:.2px;
  }
  .brand .tag{color:var(--muted); font-size:13px; letter-spacing:.08em;}
  nav.tabs{
    display:flex; gap:26px; margin-top:18px; overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--muted);
    font-size:15px; padding:10px 2px 12px 2px; border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink); border-bottom-color:var(--gold);}
  nav.tabs button:hover{color:var(--ink);}

  main{max-width:1180px;margin:0 auto;padding:28px 28px 90px 28px;}

  .hero{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:30px 34px; margin-bottom:26px;
  }
  .hero .eyebrow{color:var(--gold); font-size:13px; margin-bottom:8px;}
  .hero h2{font-family:var(--serif); font-size:30px; margin:0 0 14px 0; max-width:640px;}
  .hero p{color:var(--muted); max-width:640px; margin:0 0 20px 0;}
  .hero .btnrow{display:flex; gap:12px; flex-wrap:wrap;}

  .btn{
    border:1px solid var(--line); background:var(--panel-hi); color:var(--ink);
    padding:12px 18px; border-radius:8px; font-size:14.5px; font-weight:600;
  }
  .btn:hover{border-color:var(--gold);}
  .btn.primary{
    background:linear-gradient(135deg,var(--red),var(--red-bright)); border-color:transparent; color:#fff;
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.small{padding:8px 12px; font-size:13px;}
  .btn[disabled]{opacity:.45; cursor:default;}
  .btn[disabled]:hover{border-color:var(--line);}

  .stat-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px;
  }
  .stat .label{color:var(--muted); font-size:12.5px; margin-bottom:10px;}
  .stat .value{font-family:var(--serif); font-size:34px;}
  .stat .value small{font-size:16px; color:var(--muted); font-family:var(--sans);}
  .stat .sub{color:var(--muted); font-size:12.5px; margin-top:6px;}
  .bar{height:4px;border-radius:2px;background:var(--line); margin-top:10px; overflow:hidden;}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red-bright));}

  .two-col{display:grid; grid-template-columns:1.5fr 1fr; gap:18px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px;}
  .card h3{font-family:var(--serif); font-size:19px; margin:0 0 6px 0;}
  .card .hint{color:var(--muted); font-size:13.5px; margin-bottom:16px;}

  .chapter-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:11px 0; border-top:1px solid var(--line);
  }
  .chapter-row:first-of-type{border-top:none;}
  .chapter-row .num{color:var(--muted); width:20px; font-size:13.5px;}
  .chapter-row .name{flex:1; font-size:14.5px;}
  .chapter-row .prog{width:130px; display:flex; align-items:center; gap:8px;}
  .chapter-row .prog .bar{flex:1;margin-top:0;}
  .chapter-row .pct{width:34px; text-align:right; font-size:12.5px; color:var(--muted);}

  .trap-mini{border-top:1px solid var(--line); padding:10px 0; font-size:13.5px;}
  .trap-mini:first-of-type{border-top:none;}
  .trap-mini b{color:var(--gold);}

  /* ---------- Cours ---------- */
  .cours-layout{display:grid; grid-template-columns:270px 1fr; gap:22px;}
  .cours-nav .part-label{
    color:var(--muted); font-size:11.5px; letter-spacing:.06em; margin:18px 0 8px 4px;
  }
  .cours-nav .part-label:first-child{margin-top:0;}
  .cours-nav button{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--muted); padding:9px 12px; border-radius:7px; font-size:14px; margin-bottom:2px;
  }
  .cours-nav button.active{background:var(--gold-soft); color:var(--ink); font-weight:600;}
  .cours-nav button:hover{color:var(--ink);}
  .cours-content .kicker{color:var(--muted); font-size:12.5px; margin-bottom:4px;}
  .cours-content h2{font-family:var(--serif); font-size:28px; margin:0 0 4px 0;}
  .cours-content .subtitle{color:var(--muted); font-style:italic; margin-bottom:20px;}
  .idea-box{
    border-left:3px solid var(--gold); background:var(--gold-soft); border-radius:0 8px 8px 0;
    padding:16px 20px; margin-bottom:22px;
  }
  .idea-box .lab{color:var(--gold); font-size:12px; letter-spacing:.06em; margin-bottom:6px;}
  .idea-box p{margin:0; font-family:var(--serif); font-size:17px;}
  .details ul{margin:0; padding-left:20px;}
  .details li{margin-bottom:10px; font-size:14.5px;}
  .vocab-table{width:100%; border-collapse:collapse; margin-top:20px;}
  .vocab-table th{text-align:left; color:var(--muted); font-size:12px; font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  .vocab-table td{padding:9px 10px; border-bottom:1px solid var(--line); font-size:14px;}
  .vocab-table td.en{font-weight:600;}

  /* ---------- Entrainement subnav ---------- */
  .subnav{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px;}
  .subnav button{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:20px; font-size:13.5px;
  }
  .subnav button.active{background:var(--gold-soft); border-color:var(--gold); color:var(--ink);}

  /* flashcards */
  .flash-wrap{max-width:560px;margin:0 auto;}
  .flash-meta{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-bottom:10px;}
  .flashcard{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:50px 30px; text-align:center; min-height:230px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  .flashcard .term{font-family:var(--serif); font-size:28px;}
  .flashcard .def{color:var(--muted); font-size:15px; max-width:420px; line-height:1.6;}
  .rate-row{display:flex; gap:10px; justify-content:center; margin-top:20px;}
  .rate-row .btn.good{border-color:var(--good); color:var(--good);}
  .rate-row .btn.bad{border-color:var(--bad); color:var(--bad);}
  .flash-empty{text-align:center; color:var(--muted); padding:60px 0;}

  /* lexique */
  .lex-search{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:11px 14px; border-radius:8px; margin-bottom:16px; font-size:14px;
  }

  /* traps */
  .trap-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:12px;}
  .trap-card h4{font-family:var(--serif); margin:0 0 10px 0; font-size:16.5px;}
  .trap-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:10px;}
  .trap-side{border-radius:8px; padding:12px 14px; font-size:13.5px;}
  .trap-side.wrong{background:rgba(193,85,74,.1); border:1px solid rgba(193,85,74,.35);}
  .trap-side.right{background:rgba(95,168,118,.1); border:1px solid rgba(95,168,118,.35);}
  .trap-side .tag{font-size:11px; letter-spacing:.05em; margin-bottom:6px; display:block;}
  .trap-side.wrong .tag{color:var(--bad);}
  .trap-side.right .tag{color:var(--good);}
  .trap-card .explain{color:var(--muted); font-size:13px;}

  /* quiz */
  .quiz-wrap{max-width:680px; margin:0 auto;}
  .quiz-progress{color:var(--muted); font-size:12.5px; margin-bottom:10px;}
  .quiz-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px;}
  .quiz-card .qtext{font-family:var(--serif); font-size:20px; margin-bottom:22px;}
  .opt{
    display:block; width:100%; text-align:left; background:var(--bg2); border:1px solid var(--line);
    color:var(--ink); padding:13px 16px; border-radius:8px; margin-bottom:10px; font-size:14.5px;
  }
  .opt:hover{border-color:var(--gold);}
  .opt.correct{border-color:var(--good); background:rgba(95,168,118,.12);}
  .opt.incorrect{border-color:var(--bad); background:rgba(193,85,74,.12);}
  .feedback{margin-top:14px; padding:14px 16px; border-radius:8px; font-size:13.5px; background:var(--bg2); border:1px solid var(--line);}
  .feedback.ok{border-color:var(--good);}
  .feedback.ko{border-color:var(--bad);}
  .quiz-footer{display:flex; justify-content:flex-end; margin-top:18px;}
  .exam-item{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:14px;}
  .exam-item .qtext{font-family:var(--serif); font-size:16.5px; margin-bottom:14px;}
  .exam-item label{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:14px; cursor:pointer;}
  .exam-item label input{margin-top:3px;}
  .exam-header{
    position:sticky; top:0; background:var(--bg); z-index:5; padding:14px 0; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
  }
  .exam-header .timer{font-family:var(--serif); font-size:22px;}
  .exam-header .timer.low{color:var(--bad);}
  .exam-result{background:var(--panel); border:1px solid var(--gold); border-radius:10px; padding:24px; margin-bottom:20px; text-align:center;}
  .exam-result .score{font-family:var(--serif); font-size:40px; color:var(--gold);}

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline:before{content:"";position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .t-item{position:relative; margin-bottom:22px; cursor:pointer;}
  .t-item:before{
    content:""; position:absolute; left:-26px; top:4px; width:12px; height:12px; border-radius:50%;
    background:var(--bg); border:2px solid var(--gold);
  }
  .t-item.open:before{background:var(--gold);}
  .t-item .yr{font-family:var(--serif); font-size:17px; color:var(--gold);}
  .t-item .ttl{font-weight:600; font-size:14.5px; margin-top:2px;}
  .t-item .body{color:var(--muted); font-size:13.5px; margin-top:8px; max-width:560px; display:none;}
  .t-item.open .body{display:block;}

  .alliance-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .alliance-col{border-radius:10px; padding:22px; border:1px solid var(--line);}
  .alliance-col.entente{background:rgba(95,168,118,.08);}
  .alliance-col.triplice{background:rgba(193,85,74,.08);}
  .alliance-col h4{font-family:var(--serif); font-size:19px; margin:0 0 4px 0;}
  .alliance-col .sub{color:var(--muted); font-size:12.5px; margin-bottom:14px;}
  .chip{display:inline-block; background:var(--panel-hi); border:1px solid var(--line); padding:6px 12px; border-radius:16px; font-size:13px; margin:0 6px 8px 0;}
  .callout{background:var(--gold-soft); border:1px solid var(--gold); border-radius:8px; padding:14px 16px; font-size:13.5px; margin-top:18px;}

  .fab{
    position:fixed; bottom:24px; right:24px; background:var(--gold); color:#1a1500;
    padding:12px 18px; border-radius:24px; font-weight:700; border:none; font-size:13.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }

  @media(max-width:820px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .cours-layout{grid-template-columns:1fr;}
    .trap-grid{grid-template-columns:1fr;}
    .alliance-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">CH</span>
    <h1>Suisse &amp; 1914</h1>
    <span class="tag">RÉVISION D'HISTOIRE</span>
  </div>
  <nav class="tabs" id="mainTabs"></nav>
</header>
<main id="app"></main>
<button class="fab" id="fabBtn">Révision express</button>

<script>
/* ============================= DATA ============================= */

const CHAPTERS = [
  {id:1, part:1, title:"Les régimes politiques", subtitle:"Absolute monarchy · constitutional monarchy · dictatorship · democracy",
    idea:"Un régime politique définit qui détient le pouvoir, et si ce pouvoir est limité ou non.",
    details:[
      "Absolute monarchy : un monarque héréditaire exerce un pouvoir absolu jusqu'à sa mort ou son abdication. Ex : Arabie saoudite, Oman, Brunei, Qatar, Vatican.",
      "Constitutional monarchy : le monarque agit selon une constitution ; le pouvoir réel appartient au parlement élu et au premier ministre. Ex : Royaume-Uni, Japon, Norvège, Pays-Bas, Maroc, Suède, Espagne, Jordanie.",
      "Dictatorship : pouvoir absolu d'un individu ou d'un petit groupe, sans constitution ni opposition, souvent lié à une crise sociale. Ex : Corée du Nord, Myanmar, Staline, Hitler, Mussolini."
    ],
    vocab:[["Absolute monarchy","monarchie absolue"],["Constitutional monarchy","monarchie constitutionnelle"],["Dictatorship","dictature"],["Autocratic sovereignty","souveraineté autocratique"]]},

  {id:2, part:1, title:"Les trois démocraties", subtitle:"Direct · representative · semi-direct (hybrid)",
    idea:"La démocratie n'est pas unique : la Suisse combine les trois formes à la fois.",
    details:[
      "Direct democracy : les citoyens votent eux-mêmes les lois en assemblée, sans intermédiaire. Nécessite une petite population. Ex : Appenzell Innerrhoden et Glarus (Landsgemeinde).",
      "Representative democracy : des représentants élus légifèrent au nom du peuple pour une durée déterminée. Ex : Allemagne, Brésil, Inde, France, USA.",
      "Semi-direct / hybrid democracy : représentants élus + droit de proposer une initiative populaire ou de demander un référendum. Le meilleur exemple est la Suisse."
    ],
    vocab:[["Direct democracy","démocratie directe"],["Representative democracy","démocratie représentative"],["Semi-direct democracy","démocratie semi-directe"],["Landsgemeinde","assemblée populaire à ciel ouvert"]]},

  {id:3, part:1, title:"Gauche et droite", subtitle:"Le rôle de l'état, de la société et de l'économie",
    idea:"Aucun parti suisse n'a la majorité seul : les alliances se font selon les sujets.",
    details:[
      "Left-wing : état social fort qui réduit les inégalités, intérêts des travailleurs, contrôle des prix, plus de paix / moins de militaire.",
      "Right-wing : liberté et responsabilité individuelle, intérêts des employeurs, libre entreprise, défense nationale forte."
    ],
    vocab:[["Left-wing","gauche"],["Right-wing","droite"],["Welfare state","état social"]]},

  {id:4, part:1, title:"La Suisse en un coup d'oeil", subtitle:"26 cantons · 3 pouvoirs · 4 langues",
    idea:"Un état fédéral né en 1848, où le pouvoir est partagé entre trois niveaux.",
    details:[
      "26 cantons (23 historiques, 3 divisés en deux demi-cantons).",
      "Trois pouvoirs : législatif (Parlement), exécutif (Conseil fédéral), judiciaire (tribunaux).",
      "4 langues nationales : allemand (61%), français (23%), italien (8%), romanche (0.5%).",
      "Fédéralisme : le pouvoir est partagé entre la Confédération, les 26 cantons et les 2110 communes."
    ],
    vocab:[["Canton","canton"],["Federalism","fédéralisme"],["Separation of powers","séparation des pouvoirs"],["Commune","commune"]]},

  {id:5, part:1, title:"Le Parlement", subtitle:"National Council · Council of States · Federal Assembly",
    idea:"Deux chambres, mêmes pouvoirs : le peuple et les cantons doivent être d'accord.",
    details:[
      "National Council : 200 députés, élus tous les 4 ans, proportionnellement à la population de chaque canton (19 pour Vaud, 35 pour Zurich, 1 pour Glaris). C'est la « chambre du peuple ».",
      "Council of States : 46 sénateurs, 2 par canton (1 pour les anciens demi-cantons). C'est la « chambre des cantons ».",
      "Federal Assembly = les deux chambres réunies ; elle élit le Conseil fédéral, les juges fédéraux et le chancelier."
    ],
    vocab:[["National Council","Conseil national"],["Council of States","Conseil des États"],["Federal Assembly","Assemblée fédérale"]]},

  {id:6, part:1, title:"Le Conseil fédéral", subtitle:"7 ministres égaux · la formule magique",
    idea:"7 ministres égaux, une présidence tournante d'un an, une répartition des sièges négociée.",
    details:[
      "Federal Council : gouvernement suisse, 7 membres égaux. Ils pratiquent la collégialité : la décision commune est défendue publiquement, même par ceux qui n'étaient pas d'accord en interne.",
      "Magic formula (2:2:2:1) : répartition des 7 sièges entre les partis les plus forts au Parlement.",
      "Le Conseil fédéral est élu par l'Assemblée fédérale pour 4 ans, rééligible sans limite de mandats."
    ],
    vocab:[["Federal Council","Conseil fédéral"],["Magic formula","formule magique"],["Collegiality","collégialité"]]},

  {id:7, part:1, title:"Les droits populaires", subtitle:"Referendum · popular initiative",
    idea:"Le peuple a toujours le dernier mot, via deux instruments bien distincts.",
    details:[
      "Optional referendum : pour s'opposer à une loi déjà votée par le Parlement. Il faut 50 000 signatures en 100 jours. Majorité simple des votants suffit.",
      "Mandatory referendum : obligatoire pour toute modification de la Constitution. Il faut une double majorité (majorité du peuple ET des cantons).",
      "Popular initiative : pour proposer un changement à la Constitution. Il faut 100 000 signatures en 18 mois."
    ],
    vocab:[["Optional referendum","référendum facultatif"],["Mandatory referendum","référendum obligatoire"],["Popular initiative","initiative populaire"],["Double majority","double majorité"]]},

  {id:8, part:1, title:"Histoire & dates clés", subtitle:"De 1291 à 2000",
    idea:"De l'alliance de 1291 à la Constitution de 2000 : une construction progressive.",
    details:[
      "1291 : alliance Uri–Schwyz–Unterwald, origine de la Confédération.",
      "1847–1848 : guerre du Sonderbund (libéraux contre conservateurs) puis première Constitution fédérale (naissance de l'état fédéral démocratique).",
      "1874 / 1891 : le référendum est introduit (1874), l'initiative populaire est introduite (1891).",
      "1971 : droit de vote des femmes au niveau fédéral.",
      "1979 : création du canton du Jura, 26e canton.",
      "2000 : entrée en vigueur de la 3e Constitution fédérale (séparation des pouvoirs)."
    ],
    vocab:[["Sonderbund War","guerre du Sonderbund"],["Federal Constitution","Constitution fédérale"],["Women's suffrage","droit de vote des femmes"]]},

  {id:9, part:2, title:"L'étincelle : Sarajevo", subtitle:"28 juin 1914",
    idea:"Un assassinat suffit à mettre le feu aux poudres — mais seulement parce que tout était déjà prêt à exploser.",
    details:[
      "28 juin 1914 : assassinat de l'archiduc François-Ferdinand par Gavrilo Princip, un Serbe de Bosnie, à Sarajevo — alors en Autriche-Hongrie.",
      "Cet événement déclenche la guerre, mais les causes profondes sont multiples et bien antérieures à 1914."
    ],
    vocab:[["Assassination","assassinat"],["Trigger event","élément déclencheur"],["Archduke","archiduc"]]},

  {id:10, part:2, title:"La revanche française", subtitle:"Alsace-Lorraine, 1870",
    idea:"La France n'a jamais digéré la défaite de 1870.",
    details:[
      "Défaite française de 1870 face à la Prusse : perte de l'Alsace et de la Lorraine.",
      "Sentiment de revanche largement partagé dans une France d'environ 39 millions d'habitants en 1911."
    ],
    vocab:[["Revanchism","revanchisme"],["Alsace-Lorraine","Alsace-Lorraine"]]},

  {id:11, part:2, title:"Rivalités coloniales", subtitle:"Allemagne et Italie, arrivées tard",
    idea:"Arrivées tard dans la course aux colonies, l'Allemagne et l'Italie n'ont eu que des « miettes ».",
    details:[
      "Une colonie = ressources en matières premières, émigration, débouché commercial, marché fermé, main-d'oeuvre et soldats potentiels, influence.",
      "Allemagne (unifiée par Bismarck en 1871) : colonies dès 1884 (Togo, Cameroun, Namibie, Rwanda, Tanzanie) ; rivalité avec la France (crise marocaine de 1911).",
      "Italie (unifiée autour de Cavour) : Somalie italienne (1889), nord de la Libye (1911)."
    ],
    vocab:[["Colonial rivalry","rivalité coloniale"],["Unification","unification"],["Sphere of influence","sphère d'influence"]]},

  {id:12, part:2, title:"La course aux armements", subtitle:"Se réarmer pour dissuader — ou attaquer",

const STORAGE_KEY = "swiss-wwi-progress";

// syncStatus: "off" (par défaut, rien démarré) · "checking" (en cours
// d'activation) · "synced" (compte Claude, via la capacité db) · "local"
// (capacité indisponible ou artefact ouvert hors d'une session Claude).
let syncStatus = "off";
let dbCap = null;
let progressDocRef = null;
let dbReady = false;
let dbSaveTimer = null;

function normalizeProgress(data){
  return {
    chapterScores: (data && typeof data.chapterScores==="object" && data.chapterScores) || {},
    cardBox: (data && typeof data.cardBox==="object" && data.cardBox) || {},
    questionsAsked: (data && typeof data.questionsAsked==="number") ? data.questionsAsked : 0,
    lastExam: (data && data.lastExam) || null
  };
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ progress = normalizeProgress(JSON.parse(raw)); }
  }catch(e){
    // localStorage unavailable (private browsing, restricted iframe...) — session stays in memory only
    console.warn("Progress could not be loaded, starting fresh:", e);
  }
}
function saveProgressLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    console.warn("Progress could not be saved for this session:", e);
  }
}
function saveProgress(){
  saveProgressLocal();
  scheduleRemoteSave();
}
function scheduleRemoteSave(){
  if(!dbReady || !progressDocRef) return;
  clearTimeout(dbSaveTimer);
  dbSaveTimer = setTimeout(()=>{
    progressDocRef.set(progress).catch(e=>{
      console.warn("Progress could not be synced to your Claude account:", e);
    });
  }, 600);
}

// Attempts to attach this page's progress to the viewer's Claude account via
// the `db` capability, so it survives across browsers/devices instead of
// staying stuck in this one browser's localStorage. If the capability isn't
// granted here (older viewer, or the page opened outside claude.ai), the
// app keeps working exactly as before, on localStorage alone.
// Only ever called from an explicit click (the "Activer la synchronisation"
// button) — never automatically on load — so any first-use permission
// prompt the capability shows happens on purpose, not silently in the
// middle of a quiz.
async function initRemoteProgress(){
  if(syncStatus==="checking" || syncStatus==="synced") return;
  syncStatus = "checking";
  if(state.tab==="accueil") render();
  try{
    dbCap = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null;
  }catch(e){ dbCap = null; }
  if(!dbCap){
    syncStatus = "local";
    if(state.tab==="accueil") render();
    return;
  }
  try{
    progressDocRef = dbCap.doc("progress/main");
    const snap = await progressDocRef.get();
    if(snap.exists){
      progress = normalizeProgress(snap.data());
      saveProgressLocal(); // mirror locally too, as an offline fallback
    } else {
      // First time this account opens the page: seed the account-wide
      // store from whatever was already sitting in this browser.
      await progressDocRef.set(progress);
    }
    dbReady = true;
    syncStatus = "synced";
    progressDocRef.onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites) return; // ignore echo of our own pending write
      progress = normalizeProgress(snap.data());
      saveProgressLocal();
      if(state.tab==="accueil") render();
    }, e=>{
      console.warn("Progress sync interrupted, staying on the local copy:", e);
    });
  }catch(e){
    console.warn("Progress DB unavailable, staying on localStorage:", e);
    syncStatus = "local";
  }
  if(state.tab==="accueil") render();
}

function chapterMastery(chId){
  const s = progress.chapterScores[chId];
  if(!s || s.total===0) return 0;
  return Math.round((s.correct/s.total)*100);
}
function overallMastery(){
  let c=0,t=0;
  Object.values(progress.chapterScores).forEach(s=>{c+=s.correct;t+=s.total;});
  return t===0?0:Math.round((c/t)*100);
}
function cardsAcquiredCount(){
  return CARDS.filter(c=> (progress.cardBox[c.id]||1) >= 4).length;
}
function registerAnswer(chapterId, isCorrect){
  if(!progress.chapterScores[chapterId]) progress.chapterScores[chapterId]={correct:0,total:0};
  progress.chapterScores[chapterId].total++;
  if(isCorrect) progress.chapterScores[chapterId].correct++;
  progress.questionsAsked++;
  saveProgress();
}

/* ---- Fiches (flashcards, spaced repetition) ---- */

function ensureFlashOrder(){
  if(flashState.order.length===0){
    flashState.order = CARDS.map(c=>c.id).sort((a,b)=>{
      const la=(progress.cardBox[a]||1), lb=(progress.cardBox[b]||1);
      if(la!==lb) return la-lb;
      return Math.random()-0.5;
    });
    flashState.idx = 0;
    flashState.flipped = false;
  }
}
function renderFiches(){
  ensureFlashOrder();
  if(flashState.idx >= flashState.order.length){
    return `<div class="flash-empty"><h3 style="font-family:var(--serif);">Série terminée !</h3><p>Toutes les fiches de cette session ont été vues.</p><button class="btn primary" id="btnRestartFlash">Recommencer une série</button></div>`;
  }
  const card = CARDS.find(c=>c.id===flashState.order[flashState.idx]);
  const box = progress.cardBox[card.id]||1;
  const ch = CHAPTERS.find(c=>c.id===card.chapterId);
  return `
  <div class="flash-wrap">
    <div class="flash-meta"><span>VOCABULAIRE · ${ch.title.toUpperCase()}</span><span>Boîte ${box}/5 · ${flashState.idx+1}/${flashState.order.length}</span></div>
    <div class="flashcard">
      <div class="term">${card.en}</div>
      ${flashState.flipped? `<div class="def">${card.fr}</div>` : `<button class="btn" id="btnFlip">Voir la réponse</button>`}
    </div>
    ${flashState.flipped? `
    <div class="rate-row">
      <button class="btn bad" id="btnBad">À revoir</button>
      <button class="btn good" id="btnGood">Je savais</button>
    </div>` : `<div style="text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;">Essaie de traduire avant de révéler la réponse.</div>`}
  </div>`;
}
function wireFiches(){
  const flip = document.getElementById("btnFlip");
  if(flip) flip.onclick = ()=>{ flashState.flipped=true; renderInto(); };
  const restart = document.getElementById("btnRestartFlash");
  if(restart) restart.onclick = ()=>{ flashState.order=[]; render(); };
  const good = document.getElementById("btnGood");
  const bad = document.getElementById("btnBad");
  function advance(delta){
    const cardId = flashState.order[flashState.idx];
    const cur = progress.cardBox[cardId]||1;
    progress.cardBox[cardId] = delta>0? Math.min(5,cur+1) : 1;
    saveProgress();
    flashState.idx++; flashState.flipped=false;
    render();
  }
  if(good) good.onclick = ()=>advance(1);
  if(bad) bad.onclick = ()=>advance(-1);
}
function renderInto(){
  // lightweight re-render of just entrainement body without losing subnav wiring issues
  render();
}

/* ---- Generic live quiz (used by chapter quiz & révision express) ---- */

function startQuiz(mode, chapterId){
  let list;
  if(mode==="chapter"){
    list = QUESTIONS.filter(q=>q.chapterId===chapterId);
  } else { // express
    list = [...QUESTIONS].sort(()=>Math.random()-0.5).slice(0,12);
  }
  quizState = {mode, list, idx:0, selected:null, submittedOne:false, score:0};
}

function renderQuizLive(){
  if(!quizState) return `<div class="card">Choisis un mode de quiz.</div>`;
  if(quizState.idx >= quizState.list.length){
    return `<div class="quiz-wrap"><div class="exam-result">
      <div class="score">${quizState.score}/${quizState.list.length}</div>
      <div style="color:var(--muted);margin-top:8px;">Bien joué. Continue avec un autre chapitre ou la révision express.</div>
      <button class="btn primary" style="margin-top:16px;" id="btnQuizDone">Retour</button>
    </div></div>`;
  }
  const q = quizState.list[quizState.idx];
  return `
  <div class="quiz-wrap">
    <div class="quiz-progress">Question ${quizState.idx+1} / ${quizState.list.length} ${quizState.mode==='express'?'· Révision express':''}</div>
    <div class="quiz-card">
      <div class="qtext">${q.prompt}</div>
      ${q.options.map((opt,i)=>{
        let cls="opt";
        if(quizState.submittedOne){
          if(i===q.correct) cls+=" correct";
          else if(i===quizState.selected) cls+=" incorrect";
        }
        return `<button class="${cls}" data-opt="${i}" ${quizState.submittedOne?'disabled':''}>${opt}</button>`;
      }).join("")}
      ${quizState.submittedOne? `<div class="feedback ${quizState.selected===q.correct?'ok':'ko'}">${quizState.selected===q.correct?'Correct — ':'Pas tout à fait — '}${q.explain}</div>`:""}
      ${quizState.submittedOne? `<div class="quiz-footer"><button class="btn primary" id="btnNextQ">${quizState.idx+1<quizState.list.length?'Question suivante':'Voir le score'}</button></div>`:""}
    </div>
  </div>`;
}
function wireQuizLive(){
  document.querySelectorAll(".opt[data-opt]").forEach(b=>{
    b.onclick = ()=>{
      if(quizState.submittedOne) return;
      const i = parseInt(b.dataset.opt);
      quizState.selected = i;
      quizState.submittedOne = true;
      const q = quizState.list[quizState.idx];
      const isCorrect = i===q.correct;
      if(isCorrect) quizState.score++;
      registerAnswer(q.chapterId, isCorrect);
      render();
    };
  });
  const next = document.getElementById("btnNextQ");
  if(next) next.onclick = ()=>{
    quizState.idx++; quizState.selected=null; quizState.submittedOne=false;
    render();
  };
  const done = document.getElementById("btnQuizDone");
  if(done) done.onclick = ()=>{ quizState=null; state.entSub="quiz-chapitre"; render(); };
}

let examState = null; // {answers:{}, submitted:false, secondsLeft, timerId, list}

function renderExamen(){
  if(!examState){
    return `<div class="card" style="max-width:640px;">
      <div class="kicker">CONDITIONS DU TEST</div>
      <h3 style="font-size:24px;">Examen blanc — 20 questions, 30 minutes</h3>
      <p style="color:var(--muted);">Aucun indice, aucune correction avant la fin. Le mélange couvre les deux parties : système politique suisse et causes de la 1GM. Prends une feuille si tu veux noter tes raisonnements.</p>
      <div class="btnrow">
        <button class="btn primary" id="btnStartTimed">Démarrer le chronomètre</button>
        <button class="btn" id="btnStartUntimed">Sans chronomètre</button>
      </div>
    </div>`;
  }
  if(examState.submitted){
    let score=0;
    examState.list.forEach(q=>{ if(examState.answers[q.id]===q.correct) score++; });
    return `<div class="quiz-wrap">
      <div class="exam-result">
        <div class="score">${score}/${examState.list.length}</div>
        <div style="color:var(--muted);margin-top:8px;">${score>=examState.list.length*0.8?'Excellent niveau !':score>=examState.list.length*0.6?'Bonne base, revois les points faibles ci-dessous.':"Retourne réviser les chapitres où tu t'es trompé."}</div>
        <button class="btn primary" style="margin-top:16px;" id="btnExamRestart">Refaire un examen blanc</button>
      </div>
      ${examState.list.map((q,i)=>{
        const given = examState.answers[q.id];
        const ok = given===q.correct;
        return `<div class="exam-item">
          <div class="qtext">${i+1}. ${q.prompt}</div>
          ${q.options.map((opt,oi)=>{
            let cls="opt";
            if(oi===q.correct) cls+=" correct"; else if(oi===given) cls+=" incorrect";
            return `<div class="${cls}">${opt}</div>`;
          }).join("")}
          <div class="feedback ${ok?'ok':'ko'}">${ok?'Correct — ':'Faux — '}${q.explain}</div>
        </div>`;
      }).join("")}
    </div>`;
  }
  const mm = String(Math.floor(examState.secondsLeft/60)).padStart(2,"0");
  const ss = String(examState.secondsLeft%60).padStart(2,"0");
  return `<div class="quiz-wrap">
    ${examState.timed? `<div class="exam-header"><div>Examen blanc — ${examState.list.length} questions</div><div class="timer ${examState.secondsLeft<180?'low':''}">${mm}:${ss}</div></div>`
      : `<div class="exam-header"><div>Examen blanc — ${examState.list.length} questions</div><div style="color:var(--muted);font-size:13px;">Sans chronomètre</div></div>`}
    ${examState.list.map((q,i)=>`
      <div class="exam-item">
        <div class="qtext">${i+1}. ${q.prompt}</div>
        ${q.options.map((opt,oi)=>`
          <label><input type="radio" name="exq-${q.id}" value="${oi}" ${examState.answers[q.id]===oi?'checked':''}> ${opt}</label>
        `).join("")}
      </div>
    `).join("")}
    <button class="btn primary" id="btnSubmitExam" style="width:100%;padding:16px;font-size:15px;">Soumettre l'examen</button>
  </div>`;
}

function wireExamen(){
  const startTimed = document.getElementById("btnStartTimed");
  const startUntimed = document.getElementById("btnStartUntimed");
  if(startTimed) startTimed.onclick = ()=> beginExam(true);
  if(startUntimed) startUntimed.onclick = ()=> beginExam(false);

  document.querySelectorAll('.exam-item input[type=radio]').forEach(r=>{
    r.onchange = ()=>{
      const qid = r.name.replace("exq-","");
      examState.answers[qid] = parseInt(r.value);
    };
  });
  const submit = document.getElementById("btnSubmitExam");
  if(submit) submit.onclick = ()=> finishExam();
  const restart = document.getElementById("btnExamRestart");
  if(restart) restart.onclick = ()=>{ examState=null; render(); };
}
function beginExam(timed){
  const list = EXAM_IDS.map(id=>QUESTIONS.find(q=>q.id===id));
  examState = {answers:{}, submitted:false, secondsLeft:1800, timed, list, timerId:null};
  if(timed){
    examState.timerId = setInterval(()=>{
      examState.secondsLeft--;
      if(examState.secondsLeft<=0){ clearInterval(examState.timerId); finishExam(); }
      else { const el=document.querySelector('.exam-header .timer'); if(el){ const mm=String(Math.floor(examState.secondsLeft/60)).padStart(2,"0"); const ss=String(examState.secondsLeft%60).padStart(2,"0"); el.textContent=mm+":"+ss; if(examState.secondsLeft<180) el.classList.add('low'); } }
    },1000);
  }
  render();
}
function finishExam(){
  if(examState.timerId) clearInterval(examState.timerId);
  examState.submitted = true;
  let score=0;
  examState.list.forEach(q=>{
    const given = examState.answers[q.id];
    const ok = given===q.correct;
    if(ok) score++;
    registerAnswer(q.chapterId, ok);
  });
  progress.lastExam = {score, total:examState.list.length, date:new Date().toLocaleDateString('fr-CH')};
  saveProgress();
  render();
}

/* ============================= MAIN RENDER ============================= */

function render(){
  try{
    renderNav();
    const app = document.getElementById("app");
    if(state.tab==="accueil"){ app.innerHTML = renderAccueil(); wireAccueil(); }
    else if(state.tab==="cours"){ app.innerHTML = renderCours(); wireCours(); }
    else if(state.tab==="entrainement"){ app.innerHTML = renderEntrainement(); wireEntrainement(); wireLexique(); }
    else if(state.tab==="frises"){ app.innerHTML = renderFrises(); wireFrises(); }
    else if(state.tab==="examen"){ app.innerHTML = renderExamen(); wireExamen(); }
    const fab = document.getElementById("fabBtn");
    if(fab) fab.style.display = (state.tab==="accueil")? "none":"block";
  }catch(err){
    console.error("Render error:", err);
    const app = document.getElementById("app");
    if(app){
      app.innerHTML = `<div class="card"><h3>Un souci d'affichage est survenu</h3>
        <p style="color:var(--muted);">Réessaie, ou reviens à l'accueil.</p>
        <button class="btn primary" id="btnRecover">Retour à l'accueil</button></div>`;
      const rec = document.getElementById("btnRecover");
      if(rec) rec.onclick = ()=>{ state.tab="accueil"; quizState=null; examState=null; render(); };
    }
  }
}

/* ============================= INIT ============================= */

(function init(){
  loadProgress();
  render();
})();

</script>
</body>
</html>
