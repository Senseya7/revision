<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grande Guerre 1914–1919</title>
<style>
  :root{
    --bg:#14161c;
    --bg2:#191c23;
    --panel:#20232c;
    --panel-hi:#262a35;
    --line:#2c303c;
    --ink:#eae6da;
    --muted:#8d90a0;
    --red:#a8382a;
    --red-bright:#c9503f;
    --gold:#c8a24a;
    --gold-soft:rgba(200,162,74,.16);
    --good:#5fa876;
    --bad:#c1554a;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold-soft);}

  /* ---------- Header ---------- */
  header.top{
    padding:22px 28px 0 28px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--bg2), var(--bg) 90%);
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:4px;
    background:linear-gradient(135deg,var(--red),var(--red-bright));
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--serif); font-weight:700; color:#fff; font-size:16px;
    flex:0 0 auto;
  }
  .brand h1{
    font-family:var(--serif);
    font-size:26px; font-weight:600; margin:0; letter-spacing:.2px;
  }
  .brand .tag{color:var(--muted); font-size:13px; letter-spacing:.08em;}
  nav.tabs{
    display:flex; gap:26px; margin-top:18px; overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--muted);
    font-size:15px; padding:10px 2px 12px 2px; border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink); border-bottom-color:var(--gold);}
  nav.tabs button:hover{color:var(--ink);}

  main{max-width:1180px;margin:0 auto;padding:28px 28px 90px 28px;}

  .hero{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:30px 34px; margin-bottom:26px;
  }
  .hero .eyebrow{color:var(--gold); font-size:13px; margin-bottom:8px;}
  .hero h2{font-family:var(--serif); font-size:30px; margin:0 0 14px 0; max-width:640px;}
  .hero p{color:var(--muted); max-width:640px; margin:0 0 20px 0;}
  .hero .btnrow{display:flex; gap:12px; flex-wrap:wrap;}

  .btn{
    border:1px solid var(--line); background:var(--panel-hi); color:var(--ink);
    padding:12px 18px; border-radius:8px; font-size:14.5px; font-weight:600;
  }
  .btn:hover{border-color:var(--gold);}
  .btn.primary{
    background:linear-gradient(135deg,var(--red),var(--red-bright)); border-color:transparent; color:#fff;
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.small{padding:8px 12px; font-size:13px;}
  .btn[disabled]{opacity:.45; cursor:default;}
  .btn[disabled]:hover{border-color:var(--line);}

  .stat-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px;
  }
  .stat .label{color:var(--muted); font-size:12.5px; margin-bottom:10px;}
  .stat .value{font-family:var(--serif); font-size:34px;}
  .stat .value small{font-size:16px; color:var(--muted); font-family:var(--sans);}
  .stat .sub{color:var(--muted); font-size:12.5px; margin-top:6px;}
  .bar{height:4px;border-radius:2px;background:var(--line); margin-top:10px; overflow:hidden;}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red-bright));}

  .two-col{display:grid; grid-template-columns:1.5fr 1fr; gap:18px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px;}
  .card h3{font-family:var(--serif); font-size:19px; margin:0 0 6px 0;}
  .card .hint{color:var(--muted); font-size:13.5px; margin-bottom:16px;}

  .chapter-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:11px 0; border-top:1px solid var(--line);
  }
  .chapter-row:first-of-type{border-top:none;}
  .chapter-row .num{color:var(--muted); width:20px; font-size:13.5px;}
  .chapter-row .name{flex:1; font-size:14.5px;}
  .chapter-row .prog{width:130px; display:flex; align-items:center; gap:8px;}
  .chapter-row .prog .bar{flex:1;margin-top:0;}
  .chapter-row .pct{width:34px; text-align:right; font-size:12.5px; color:var(--muted);}

  .trap-mini{border-top:1px solid var(--line); padding:10px 0; font-size:13.5px;}
  .trap-mini:first-of-type{border-top:none;}
  .trap-mini b{color:var(--gold);}

  /* ---------- Cours ---------- */
  .cours-layout{display:grid; grid-template-columns:270px 1fr; gap:22px;}
  .cours-nav .part-label{
    color:var(--muted); font-size:11.5px; letter-spacing:.06em; margin:18px 0 8px 4px;
  }
  .cours-nav .part-label:first-child{margin-top:0;}
  .cours-nav button{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--muted); padding:9px 12px; border-radius:7px; font-size:14px; margin-bottom:2px;
  }
  .cours-nav button.active{background:var(--gold-soft); color:var(--ink); font-weight:600;}
  .cours-nav button:hover{color:var(--ink);}
  .cours-content .kicker{color:var(--muted); font-size:12.5px; margin-bottom:4px;}
  .cours-content h2{font-family:var(--serif); font-size:28px; margin:0 0 4px 0;}
  .cours-content .subtitle{color:var(--muted); font-style:italic; margin-bottom:20px;}
  .idea-box{
    border-left:3px solid var(--gold); background:var(--gold-soft); border-radius:0 8px 8px 0;
    padding:16px 20px; margin-bottom:22px;
  }
  .idea-box .lab{color:var(--gold); font-size:12px; letter-spacing:.06em; margin-bottom:6px;}
  .idea-box p{margin:0; font-family:var(--serif); font-size:17px;}
  .details ul{margin:0; padding-left:20px;}
  .details li{margin-bottom:10px; font-size:14.5px;}
  .vocab-table{width:100%; border-collapse:collapse; margin-top:20px;}
  .vocab-table th{text-align:left; color:var(--muted); font-size:12px; font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  .vocab-table td{padding:9px 10px; border-bottom:1px solid var(--line); font-size:14px;}
  .vocab-table td.en{font-weight:600;}

  /* ---------- Entrainement subnav ---------- */
  .subnav{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px;}
  .subnav button{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:20px; font-size:13.5px;
  }
  .subnav button.active{background:var(--gold-soft); border-color:var(--gold); color:var(--ink);}

  /* flashcards */
  .flash-wrap{max-width:560px;margin:0 auto;}
  .flash-meta{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-bottom:10px;}
  .flashcard{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:50px 30px; text-align:center; min-height:230px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  .flashcard .term{font-family:var(--serif); font-size:28px;}
  .flashcard .def{color:var(--muted); font-size:15px; max-width:420px; line-height:1.6;}
  .rate-row{display:flex; gap:10px; justify-content:center; margin-top:20px;}
  .rate-row .btn.good{border-color:var(--good); color:var(--good);}
  .rate-row .btn.bad{border-color:var(--bad); color:var(--bad);}
  .flash-empty{text-align:center; color:var(--muted); padding:60px 0;}

  /* lexique */
  .lex-search{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:11px 14px; border-radius:8px; margin-bottom:16px; font-size:14px;
  }

  /* traps */
  .trap-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:12px;}
  .trap-card h4{font-family:var(--serif); margin:0 0 10px 0; font-size:16.5px;}
  .trap-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:10px;}
  .trap-side{border-radius:8px; padding:12px 14px; font-size:13.5px;}
  .trap-side.wrong{background:rgba(193,85,74,.1); border:1px solid rgba(193,85,74,.35);}
  .trap-side.right{background:rgba(95,168,118,.1); border:1px solid rgba(95,168,118,.35);}
  .trap-side .tag{font-size:11px; letter-spacing:.05em; margin-bottom:6px; display:block;}
  .trap-side.wrong .tag{color:var(--bad);}
  .trap-side.right .tag{color:var(--good);}
  .trap-card .explain{color:var(--muted); font-size:13px;}

  /* quiz */
  .quiz-wrap{max-width:680px; margin:0 auto;}
  .quiz-progress{color:var(--muted); font-size:12.5px; margin-bottom:10px;}
  .quiz-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px;}
  .quiz-card .qtext{font-family:var(--serif); font-size:20px; margin-bottom:22px;}
  .opt{
    display:block; width:100%; text-align:left; background:var(--bg2); border:1px solid var(--line);
    color:var(--ink); padding:13px 16px; border-radius:8px; margin-bottom:10px; font-size:14.5px;
  }
  .opt:hover{border-color:var(--gold);}
  .opt.correct{border-color:var(--good); background:rgba(95,168,118,.12);}
  .opt.incorrect{border-color:var(--bad); background:rgba(193,85,74,.12);}
  .feedback{margin-top:14px; padding:14px 16px; border-radius:8px; font-size:13.5px; background:var(--bg2); border:1px solid var(--line);}
  .feedback.ok{border-color:var(--good);}
  .feedback.ko{border-color:var(--bad);}
  .quiz-footer{display:flex; justify-content:flex-end; margin-top:18px;}
  .exam-item{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:14px;}
  .exam-item .qtext{font-family:var(--serif); font-size:16.5px; margin-bottom:14px;}
  .exam-item label{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:14px; cursor:pointer;}
  .exam-item label input{margin-top:3px;}
  .exam-header{
    position:sticky; top:0; background:var(--bg); z-index:5; padding:14px 0; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
  }
  .exam-header .timer{font-family:var(--serif); font-size:22px;}
  .exam-header .timer.low{color:var(--bad);}
  .exam-result{background:var(--panel); border:1px solid var(--gold); border-radius:10px; padding:24px; margin-bottom:20px; text-align:center;}
  .exam-result .score{font-family:var(--serif); font-size:40px; color:var(--gold);}

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline:before{content:"";position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .t-item{position:relative; margin-bottom:22px; cursor:pointer;}
  .t-item:before{
    content:""; position:absolute; left:-26px; top:4px; width:12px; height:12px; border-radius:50%;
    background:var(--bg); border:2px solid var(--gold);
  }
  .t-item.open:before{background:var(--gold);}
  .t-item .yr{font-family:var(--serif); font-size:17px; color:var(--gold);}
  .t-item .ttl{font-weight:600; font-size:14.5px; margin-top:2px;}
  .t-item .body{color:var(--muted); font-size:13.5px; margin-top:8px; max-width:560px; display:none;}
  .t-item.open .body{display:block;}

  .alliance-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .alliance-col{border-radius:10px; padding:22px; border:1px solid var(--line);}
  .alliance-col.entente{background:rgba(95,168,118,.08);}
  .alliance-col.triplice{background:rgba(193,85,74,.08);}
  .alliance-col h4{font-family:var(--serif); font-size:19px; margin:0 0 4px 0;}
  .alliance-col .sub{color:var(--muted); font-size:12.5px; margin-bottom:14px;}
  .chip{display:inline-block; background:var(--panel-hi); border:1px solid var(--line); padding:6px 12px; border-radius:16px; font-size:13px; margin:0 6px 8px 0;}
  .callout{background:var(--gold-soft); border:1px solid var(--gold); border-radius:8px; padding:14px 16px; font-size:13.5px; margin-top:18px;}

  .fab{
    position:fixed; bottom:24px; right:24px; background:var(--gold); color:#1a1500;
    padding:12px 18px; border-radius:24px; font-weight:700; border:none; font-size:13.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }

  @media(max-width:820px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .cours-layout{grid-template-columns:1fr;}
    .trap-grid{grid-template-columns:1fr;}
    .alliance-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">14</span>
    <h1>La Grande Guerre</h1>
    <span class="tag">RÉVISION D'HISTOIRE</span>
    <a href="index.html" style="margin-left:auto;color:var(--muted);font-size:13px;text-decoration:none;">← Toutes les révisions</a>
  </div>
  <nav class="tabs" id="mainTabs"></nav>
</header>
<main id="app"></main>
<button class="fab" id="fabBtn">Révision express</button>

<script>
/* ============================= DATA ============================= */

const CHAPTERS = [
  {id:1, part:1, title:"Les causes de la guerre", subtitle:"Nationalism · alliances · internal dissent · militarism",
    idea:"Au lieu d'apporter la paix, le système des États-nations a créé une Europe de rivalités prête à exploser.",
    details:[
      "Nationalism : rivalités pour les colonies et le commerce, à l'âge de l'impérialisme. Des peuples sans État rêvent du leur : Slaves des Balkans et de l'Empire des Habsbourg, Irlandais (Empire britannique), Polonais (Empire russe).",
      "Deux blocs d'alliances : la Triple Alliance (1882) = Allemagne, Autriche-Hongrie, Italie ; la Triple Entente (1907) = France, Grande-Bretagne, Russie.",
      "Crises balkaniques de 1908 à 1913 : elles laissent les États européens en colère et avides de revanche.",
      "Internal dissent : les mouvements socialistes ouvriers multiplient les grèves ; des dirigeants conservateurs, craignant une révolution, ont pu voir la guerre comme un moyen d'étouffer le désordre intérieur.",
      "Militarism : la plupart des pays ont la conscription (sauf USA et Grande-Bretagne) ; les armées européennes doublent entre 1890 et 1914. Les plans de mobilisation des militaires, jugés impossibles à modifier, enferment les dirigeants politiques."
    ],
    vocab:[["Nationalism","nationalisme"],["Militarism","militarisme (préparation agressive à la guerre)"],["Conscription","conscription, service militaire obligatoire"],["Triple Alliance","Triple-Alliance / Triplice"],["Triple Entente","Triple-Entente"]]},

  {id:2, part:1, title:"Sarajevo et l'engrenage", subtitle:"28 juin → 4 août 1914",
    idea:"Un assassinat dans les Balkans + des alliances + des plans militaires rigides = toutes les grandes puissances en guerre en cinq semaines.",
    details:[
      "28 juin 1914 : l'archiduc François-Ferdinand, héritier d'Autriche-Hongrie, et sa femme Sophie sont tués à Sarajevo (Bosnie) par Gavrilo Princip, 19 ans, Serbe de Bosnie, membre de la Main noire (Black Hand).",
      "L'Allemagne de Guillaume II donne à l'Autriche-Hongrie un « chèque en blanc » (blank check) : soutien total en cas de guerre contre la Russie.",
      "28 juillet : l'Autriche-Hongrie déclare la guerre à la Serbie. La Russie de Nicolas II mobilise partiellement puis totalement (29 juillet). En 1914, mobiliser = acte de guerre.",
      "1er août : l'Allemagne déclare la guerre à la Russie ; 3 août : à la France (plan Schlieffen) ; ultimatum à la Belgique.",
      "Plan Schlieffen : guerre sur deux fronts — petite défense contre la Russie, invasion rapide de la France par la Belgique, puis retour vers l'Est.",
      "4 août : la Grande-Bretagne déclare la guerre à l'Allemagne pour violation de la neutralité belge."
    ],
    vocab:[["Mobilization","mobilisation (rassembler troupes et ravitaillement)"],["Blank check","chèque en blanc"],["Black Hand","la Main noire (organisation terroriste serbe)"],["Schlieffen Plan","plan Schlieffen"],["Ultimatum","ultimatum"]]},

  {id:3, part:1, title:"1914–1915 : illusions et enlisement", subtitle:"Propaganda · Marne · Western & Eastern Fronts",
    idea:"Tout le monde croyait à une guerre de quelques semaines ; elle s'enlise dans les tranchées à l'Ouest.",
    details:[
      "Propaganda : idées diffusées pour influencer l'opinion. En août 1914, l'enthousiasme est général : chacun croit sa cause juste et la guerre courte.",
      "Première bataille de la Marne (6–10 septembre 1914) : l'avance allemande est stoppée près de Paris (2 000 taxis parisiens amènent des renforts). Le plan Schlieffen échoue.",
      "Western Front : deux lignes de tranchées de la Manche à la frontière suisse → guerre des tranchées et stalemate (impasse).",
      "Eastern Front : guerre de mouvement. Les Russes sont écrasés à Tannenberg (30 août) et aux lacs Mazures (15 septembre).",
      "Mai 1915 : l'Italie trahit la Triple Alliance et attaque l'Autriche → elle rejoint les Allied Powers (Alliés).",
      "Les Austro-Allemands repoussent les Russes en Galicie (2,5 millions de pertes russes) ; avec la Bulgarie (sept. 1915), ils éliminent la Serbie."
    ],
    vocab:[["Propaganda","propagande"],["Stalemate","impasse, blocage"],["Western Front","front de l'Ouest"],["Eastern Front","front de l'Est"],["Allied Powers","les Alliés"]]},

  {id:4, part:1, title:"Tranchées et nouvelles armes", subtitle:"Trench warfare · war of attrition · new technology",
    idea:"Les nouvelles armes n'ont pas brisé l'impasse — elles ont rendu la guerre la plus meurtrière jamais vue.",
    details:[
      "Tranchées protégées par des barbelés (jusqu'à 1,5 m de haut, 27 m de large), nids de mitrailleuses, artillerie lourde. Entre les lignes : le no man's land.",
      "Offensives : barrage d'artillerie, puis assaut baïonnette au canon — fauché par les mitrailleuses.",
      "War of attrition (guerre d'usure) : épuiser l'ennemi par des attaques constantes. Verdun (1916) : 700 000 morts en dix mois pour quelques kilomètres.",
      "Avions : d'abord reconnaissance, puis attaques au sol et combats aériens (mitrailleuse tirant à travers l'hélice, le Baron rouge). Zeppelins allemands sur Londres.",
      "Tanks : utilisés pour la première fois par les Britanniques en 1916. Gaz toxiques (chlore) → masques à gaz.",
      "Près de 10 millions de morts selon le manuel (le document « Consequences » parle de 19 millions, civils inclus)."
    ],
    vocab:[["Trench warfare","guerre des tranchées"],["War of attrition","guerre d'usure"],["No man's land","no man's land, zone entre les tranchées"],["Machine gun","mitrailleuse"],["Poison gas","gaz toxique"]]},

  {id:5, part:1, title:"Une guerre mondiale", subtitle:"Nouveaux alliés · Gallipoli · colonies",
    idea:"Bloqués à l'Ouest, les deux camps cherchent de nouveaux alliés et ouvrent de nouveaux fronts.",
    details:[
      "Central Powers (puissances centrales) : Allemagne, Autriche-Hongrie, Empire ottoman, + Bulgarie.",
      "Gallipoli (avril 1915) : débarquement allié près de Constantinople pour ouvrir un front dans les Balkans — un désastre, retrait.",
      "L'Italie rejoint les Alliés contre la promesse de territoires autrichiens et ouvre un front contre l'Autriche-Hongrie.",
      "1917 : Lawrence d'Arabie pousse les princes arabes à se révolter contre les Ottomans ; en 1918, les Britanniques (troupes d'Inde, d'Australie, de Nouvelle-Zélande) détruisent l'Empire ottoman au Moyen-Orient.",
      "Les Alliés s'emparent des colonies allemandes : le Japon (allié britannique depuis 1902) prend des îles du Pacifique, l'Australie la Nouvelle-Guinée allemande.",
      "1915 : génocide des Arméniens par l'Empire ottoman (plus d'un million de victimes)."
    ],
    vocab:[["Central Powers","puissances centrales"],["Gallipoli campaign","bataille des Dardanelles / Gallipoli"],["Ottoman Empire","Empire ottoman"],["Armenian genocide","génocide arménien"]]},

  {id:6, part:1, title:"L'entrée des États-Unis", subtitle:"Blocus · sous-marins · avril 1917",
    idea:"C'est la guerre sous-marine allemande qui fait basculer les États-Unis dans le camp allié.",
    details:[
      "La Grande-Bretagne impose un blocus naval à l'Allemagne ; l'Allemagne répond par la guerre sous-marine à outrance (unrestricted submarine warfare).",
      "7 mai 1915 : le paquebot britannique Lusitania est coulé — environ 1 100 civils morts dont plus de 100 Américains. L'Allemagne suspend la guerre sous-marine en septembre 1915.",
      "Bataille du Jutland (31 mai 1916) : seule grande bataille navale directe, sans vainqueur net.",
      "Janvier 1917 : l'Allemagne reprend la guerre sous-marine à outrance. L'amiral Holtzendorf promet : « pas un Américain ne débarquera sur le continent ».",
      "Avril 1917 : les États-Unis entrent en guerre — boost psychologique, argent et matériel ; les troupes arrivent en masse en 1918."
    ],
    vocab:[["Blockade","blocus"],["Unrestricted submarine warfare","guerre sous-marine à outrance"],["Neutrality","neutralité"],["Lusitania","Lusitania (paquebot coulé en 1915)"]]},

  {id:7, part:1, title:"La guerre totale", subtitle:"Total war · planned economies · women",
    idea:"Toute la société est mobilisée : l'arrière devient un front comme un autre.",
    details:[
      "Total war : mobilisation complète des ressources et des populations ; elle touche tous les citoyens.",
      "Les gouvernements étendent leurs pouvoirs : conscription massive, contrôle des prix, salaires et loyers, rationnement, contrôle des transports et industries → planned economies (économies dirigées).",
      "Manipulation de l'opinion : dès 1916, le moral civil craque. Régimes autoritaires : la force. Démocraties : censure, ex. le DORA britannique (Defence of the Realm Act).",
      "Propagande : exagération des atrocités allemandes en Belgique, affiches (« Daddy, what did YOU do in the Great War? »).",
      "Femmes : nouveaux emplois (38 % des ouvriers de Krupp en 1918). Mais emplois temporaires : 650 000 chômeuses en Grande-Bretagne en 1919. Gain durable : droit de vote (Allemagne, Autriche, USA ; Britanniques de plus de 30 ans).",
      "Grippe espagnole (automne 1918) : environ 50 millions de morts dans le monde."
    ],
    vocab:[["Total war","guerre totale"],["Planned economy","économie planifiée / dirigée"],["Rationing","rationnement"],["Censorship","censure"],["Home front","l'arrière"]]},

  {id:8, part:1, title:"Révolution de mars 1917", subtitle:"Chute du tsar · gouvernement provisoire",
    idea:"Défaites, pénuries et un tsar incompétent : la dynastie Romanov tombe en quelques jours.",
    details:[
      "Russie mal préparée (après la défaite contre le Japon et la révolution de 1905) : pas de chefs compétents, industrie incapable d'armer l'armée (soldats sans fusils). 2 millions de morts de 1914 à 1916.",
      "Nicolas II prend lui-même le commandement ; à la cour, Raspoutine influence la tsarine Alexandra (son fils Alexis est hémophile). Raspoutine est assassiné en décembre 1916.",
      "Début mars 1917 à Petrograd : grèves menées par des ouvrières, rationnement du pain. Le 8 mars, 10 000 femmes défilent : « Peace and Bread », « Down with Autocracy ». Grève générale le 10 mars ; les soldats rejoignent les manifestants.",
      "12 mars : la Douma crée un gouvernement provisoire. 15 mars : Nicolas II abdique — fin de 300 ans de Romanov.",
      "Le gouvernement provisoire (Kerenski) continue la guerre : erreur majeure. Il est concurrencé par les soviets (conseils d'ouvriers et de soldats)."
    ],
    vocab:[["Czar","tsar"],["Provisional government","gouvernement provisoire"],["Duma","Douma (assemblée législative russe)"],["Soviet","soviet (conseil d'ouvriers et de soldats)"],["Abdication","abdication"]]},

  {id:9, part:1, title:"Lénine et les bolcheviks", subtitle:"Révolution d'octobre / novembre 1917",
    idea:"Une minorité disciplinée profite du chaos et prend le pouvoir au nom des soviets.",
    details:[
      "Bolsheviks : faction du Parti social-démocrate russe (marxiste), dirigée par Lénine (Vladimir Ilitch Oulianov) : une « avant-garde » de révolutionnaires professionnels, révolution violente.",
      "Avril 1917 : les Allemands renvoient Lénine en Russie dans un train plombé pour y semer le désordre.",
      "Slogans : « Peace, Land, Bread », « Worker Control of Production », « All Power to the Soviets ».",
      "Nuit du 6 novembre 1917 (octobre selon l'ancien calendrier russe) : les bolcheviks, avec Trotsky à la tête du soviet de Petrograd, prennent le palais d'Hiver. Ils deviennent les Communistes.",
      "3 mars 1918 : traité de Brest-Litovsk avec l'Allemagne — la Russie cède la Pologne orientale, l'Ukraine, la Finlande et les pays baltes. La Russie sort de la guerre."
    ],
    vocab:[["Bolsheviks","bolcheviks"],["Winter Palace","palais d'Hiver"],["Treaty of Brest-Litovsk","traité de Brest-Litovsk"],["Vanguard","avant-garde"]]},

  {id:10, part:1, title:"La guerre civile russe", subtitle:"Rouges contre Blancs, 1918–1921",
    idea:"Divisés et sans but commun, les Blancs perdent face à une Armée rouge disciplinée et déterminée.",
    details:[
      "Opposants (les Blancs) : partisans du tsar, libéraux, socialistes anti-léninistes — aidés matériellement par les Alliés (plus de 100 000 soldats étrangers).",
      "Juillet 1918 : le tsar et sa famille sont assassinés à Iekaterinbourg (Oural).",
      "Raisons de la victoire rouge : Armée rouge disciplinée (Trotsky, commissaire à la guerre) ; Blancs désunis ; communisme de guerre (contrôle des banques et de l'industrie, réquisition des grains) ; terreur rouge de la Tchéka (police secrète) ; patriotisme contre les troupes étrangères.",
      "En 1921, les communistes contrôlent toute la Russie : État centralisé à parti unique, hostile aux Alliés."
    ],
    vocab:[["Civil war","guerre civile"],["Red Army","Armée rouge"],["War communism","communisme de guerre"],["Cheka","Tchéka (police secrète)"],["White forces","les Blancs (anti-bolcheviks)"]]},

  {id:11, part:1, title:"La fin de la guerre", subtitle:"Offensive de 1918 → armistice du 11 novembre",
    idea:"Le dernier coup de poker allemand échoue ; l'Empire s'effondre de l'intérieur.",
    details:[
      "Libérée du front russe, l'Allemagne (Ludendorff) lance une grande offensive en mars 1918 : à 80 km de Paris en avril.",
      "Deuxième bataille de la Marne (18 juillet 1918) : contre-attaque française, marocaine et américaine avec des centaines de tanks. 8 août : « jour noir de l'armée allemande ».",
      "29 septembre 1918 : Ludendorff annonce que la guerre est perdue.",
      "3 novembre : mutinerie des marins de Kiel ; conseils d'ouvriers et soldats. 9 novembre : Guillaume II abdique et part ; Friedrich Ebert (sociaux-démocrates) proclame la république (république de Weimar).",
      "11 novembre 1918 : armistice.",
      "Janvier 1919 : tentative communiste (spartakistes) écrasée ; Rosa Luxemburg et Karl Liebknecht sont assassinés.",
      "L'Autriche-Hongrie se désintègre : Autriche, Hongrie, Tchécoslovaquie, Yougoslavie."
    ],
    vocab:[["Armistice","armistice (trêve)"],["Mutiny","mutinerie"],["Spartacists","spartakistes (communistes allemands)"],["Weimar Republic","république de Weimar"]]},

  {id:12, part:1, title:"La conférence de paix de Paris", subtitle:"Wilson · Clemenceau · Lloyd George",
    idea:"L'idéalisme de Wilson se heurte aux intérêts nationaux de la France et de la Grande-Bretagne.",
    details:[
      "Janvier 1919 : 27 nations alliées victorieuses se réunissent à Paris. L'Allemagne n'est pas invitée ; la Russie est absente (guerre civile).",
      "Wilson (USA) et ses Fourteen Points : diplomatie ouverte (fin de la diplomatie secrète), désarmement, libre-échange, liberté des mers, autodétermination des peuples, association générale des nations.",
      "Lloyd George (Grande-Bretagne) : faire payer l'Allemagne. Clemenceau (France) : sécurité et revanche — désarmement allemand, réparations, Rhénanie séparée.",
      "Big Three : Wilson, Clemenceau, Lloyd George (Big Four avec Orlando, Italie).",
      "25 janvier 1919 : la conférence accepte la Société des Nations ; en échange Wilson cède sur les territoires. Clemenceau renonce à la Rhénanie séparée contre une alliance défensive anglo-américaine… que le Sénat américain refuse de ratifier."
    ],
    vocab:[["Fourteen Points","les Quatorze Points"],["Self-determination","droit des peuples à disposer d'eux-mêmes"],["Big Three","les Trois Grands"],["Secret diplomacy","diplomatie secrète"],["Peace conference","conférence de paix"]]},

  {id:13, part:2, title:"Un bilan catastrophique", subtitle:"Démographique · moral · financier",
    idea:"Pour l'Europe, qui dominait le monde au XIXe siècle, c'est le début du déclin.",
    details:[
      "Désastre démographique : environ 19 millions de morts (presque la moitié civils), plus de 21 millions de blessés dont les « gueules cassées », plus de 4 millions de morts supplémentaires en Europe à cause de la grippe espagnole (1918–1919). Le blocus a affamé l'Allemagne : plus de 500 000 civils morts.",
      "Catastrophe morale : combattants traumatisés ; génocide arménien (1915, plus d'un million de victimes) ; banalisation de la violence et de la mort — ce qui explique en partie la violence des milices communistes, fascistes et nazies.",
      "Désastre financier : États européens lourdement endettés, surtout envers les États-Unis ; énormes destructions dans les zones de combat.",
      "Le manuel ajoute : la guerre totale a renforcé le pouvoir des États sur les citoyens et ruiné l'idée de progrès."
    ],
    vocab:[["Casualties","pertes (morts et blessés)"],["« Gueules cassées »","soldats défigurés (facial injuries)"],["Spanish flu","grippe espagnole"],["War debts","dettes de guerre"],["Decline of Europe","déclin de l'Europe"]]},

  {id:14, part:2, title:"Le traité de Versailles", subtitle:"28 juin 1919 · le « Diktat »",
    idea:"L'Allemagne, jugée seule responsable, subit une paix si dure qu'elle ne peut pas durer.",
    details:[
      "Article 231 (War Guilt Clause) : l'Allemagne est déclarée responsable de la guerre → pour les Allemands, c'est un « Diktat ».",
      "Réparations : 132 milliards de marks-or fixés en 1921 (≈ 2 000 milliards de dollars de 2014) ; l'Allemagne en paiera environ 22, dont 9 à la France.",
      "Territoires : Alsace-Lorraine rendue à la France ; Eupen et Malmedy à la Belgique ; plébiscite à la frontière danoise ; Sarre sous administration internationale (référendum 15 ans plus tard) ; rive gauche du Rhin démilitarisée.",
      "Couloir de Dantzig : accès à la mer pour la Pologne, qui coupe l'Allemagne de la Prusse orientale. Bilan : environ 15 % du territoire et 10 % de la population perdus. Toutes les colonies perdues.",
      "Militaire : armée limitée à 100 000 hommes ; flotte, tanks, 25 000 avions et 5 000 canons livrés ou démantelés ; interdiction de posséder tanks, aviation et artillerie.",
      "Cerise sur le gâteau : perte de la propriété intellectuelle des brevets allemands (ex. l'aspirine).",
      "Le traité crée aussi la Société des Nations (SDN), à Genève."
    ],
    vocab:[["Treaty of Versailles","traité de Versailles"],["War Guilt Clause","clause de culpabilité (art. 231)"],["Reparations","réparations"],["Demilitarized zone","zone démilitarisée"],["Danzig corridor","corridor de Dantzig"]]},

  {id:15, part:2, title:"Les autres traités et la nouvelle carte", subtitle:"Saint-Germain · Trianon · Sèvres · Lausanne",
    idea:"Les empires centraux disparaissent, de nouveaux États naissent — mais les revendications nationales restent.",
    details:[
      "Saint-Germain (septembre 1919) : règle le sort de l'Autriche (rédigé en plusieurs langues… sauf l'allemand).",
      "Trianon (juin 1920) : règle le sort de la Hongrie.",
      "Sèvres (août 1920) : dissolution de l'Empire ottoman ; remplacé par le traité de Lausanne (juillet 1923) après la guerre gréco-turque gagnée par la Turquie.",
      "Nouveaux États : Finlande, Lettonie, Estonie, Lituanie, Pologne, Tchécoslovaquie, Autriche, Hongrie, Yougoslavie (Serbes, Croates, Slovènes) ; Roumanie agrandie ; Allemagne coupée en deux.",
      "Minorités partout : Allemands en Pologne ; Hongrois, Polonais et Allemands en Tchécoslovaquie ; Hongrois en Roumanie…",
      "Victoire mutilée : même un vainqueur comme l'Italie reste insatisfait.",
      "Mandats de la SDN : la France reçoit le Liban et la Syrie, la Grande-Bretagne l'Irak et la Palestine — malgré les promesses d'indépendance faites aux Arabes."
    ],
    vocab:[["Treaty of Saint-Germain","traité de Saint-Germain (Autriche)"],["Treaty of Trianon","traité de Trianon (Hongrie)"],["Treaty of Sèvres","traité de Sèvres (Empire ottoman)"],["Mandate","mandat"],["Ethnic minority","minorité ethnique"]]},

  {id:16, part:2, title:"Mythes, idéaux et héritage", subtitle:"Coup de poignard · SDN · 14 points",
    idea:"La paix de 1919 porte en elle les rancœurs et les mythes qui mèneront à la Seconde Guerre mondiale.",
    details:[
      "Mythe des « criminels de novembre » et du « coup de poignard dans le dos » (stab in the back) : pour Hitler et beaucoup d'anciens combattants, l'armée n'aurait pas été vaincue mais trahie par ceux qui ont signé l'armistice.",
      "Rappel : le 9 novembre 1918, les généraux forcent l'empereur à abdiquer ; pour éviter une prise de pouvoir des spartakistes (Rosa Luxemburg), les socialistes modérés proclament la république de Weimar, qui signe l'armistice le 11 novembre.",
      "Société des Nations (League of Nations / SDN) : créée par le traité de Versailles, siège à Genève.",
      "Les 14 points de Wilson influencent durablement la politique internationale : libre-échange, liberté des mers, démocratie, fin de la diplomatie secrète, désarmement, autodétermination.",
      "Mais le Sénat américain ne ratifie ni le traité de Versailles ni l'adhésion à la SDN : les États-Unis désavouent leur propre président."
    ],
    vocab:[["Stab-in-the-back myth","mythe du coup de poignard dans le dos"],["November criminals","criminels de novembre"],["League of Nations","Société des Nations (SDN)"],["To ratify","ratifier"],["Veterans","anciens combattants"]]}
];

const QUESTIONS = [
  {id:"q1", chapterId:1, prompt:"Which countries formed the Triple Alliance in 1882?", options:["France, Great Britain, Russia","Germany, Austria-Hungary, Italy","Germany, Austria-Hungary, Ottoman Empire","Germany, Italy, Japan"], correct:1, explain:"The Triple Alliance (1882) united Germany, Austria-Hungary and Italy."},
  {id:"q2", chapterId:1, prompt:"What is 'militarism'?", options:["A military draft","The aggressive preparation for war","A truce between armies","A naval blockade"], correct:1, explain:"Militarism is the aggressive preparation for war; European armies doubled in size between 1890 and 1914."},
  {id:"q3", chapterId:1, prompt:"Which two countries did NOT have conscription before 1914?", options:["France and Germany","Russia and Austria-Hungary","The United States and Britain","Italy and Serbia"], correct:2, explain:"Most Western countries had conscription; the United States and Britain were the exceptions."},
  {id:"q4", chapterId:2, prompt:"Who assassinated Archduke Francis Ferdinand on 28 June 1914?", options:["A French spy","Gavrilo Princip, a Bosnian Serb of the Black Hand","A Russian soldier","An Austrian anarchist"], correct:1, explain:"Gavrilo Princip, 19, a Bosnian Serb and member of the Black Hand, shot the archduke and his wife in Sarajevo."},
  {id:"q5", chapterId:2, prompt:"What was the German 'blank check'?", options:["A loan to Russia","A promise of full support to Austria-Hungary in case of war with Russia","The reparations bill of 1921","A peace offer to France"], correct:1, explain:"Emperor William II promised Austria-Hungary Germany's full support if war broke out with Russia."},
  {id:"q6", chapterId:2, prompt:"Why did Great Britain declare war on Germany on 4 August 1914?", options:["Germany attacked London","Germany violated Belgian neutrality","Germany sank the Lusitania","Germany invaded Serbia"], correct:1, explain:"Britain declared war because Germany violated Belgian neutrality (Schlieffen Plan) — and to protect its own world power."},
  {id:"q7", chapterId:2, prompt:"What did the Schlieffen Plan foresee?", options:["Attacking Russia first, then France","A quick invasion of France through Belgium, then turning east against Russia","A naval war against Britain","Defending Germany's borders only"], correct:1, explain:"The plan called for a small holding action against Russia and a rapid invasion of France through Belgium."},
  {id:"q8", chapterId:3, prompt:"Where was the German advance stopped in September 1914?", options:["At Verdun","At the First Battle of the Marne","At Tannenberg","At Gallipoli"], correct:1, explain:"The First Battle of the Marne (6–10 September 1914) stopped the Germans near Paris — 2,000 Parisian taxis brought troops."},
  {id:"q9", chapterId:3, prompt:"How did the Eastern Front differ from the Western Front?", options:["It was a war of mobility","It had no casualties","It was fought only at sea","It was a trench stalemate too"], correct:0, explain:"Unlike the trench stalemate in the west, the Eastern Front was marked by mobility — with equally enormous losses."},
  {id:"q10", chapterId:3, prompt:"At which battle (August 1914) was the Russian army decisively defeated?", options:["The Marne","Tannenberg","Jutland","The Somme"], correct:1, explain:"The Russians were defeated at Tannenberg (30 August) and at the Masurian Lakes (15 September)."},
  {id:"q11", chapterId:4, prompt:"What is a 'war of attrition'?", options:["A war of rapid movement","A war based on wearing the other side down by constant attacks and heavy losses","A war fought only by planes","A naval blockade"], correct:1, explain:"WWI became a war of attrition: wear the enemy down by constant attacks and heavy losses."},
  {id:"q12", chapterId:4, prompt:"About how many men died at Verdun in ten months in 1916?", options:["70,000","700,000","7 million","10 million"], correct:1, explain:"About 700,000 men died at Verdun over a few miles of land in 1916."},
  {id:"q13", chapterId:4, prompt:"Which country first used armored tanks in war, in 1916?", options:["Germany","France","Britain","The United States"], correct:2, explain:"The British were the first to use tanks, in 1916; caterpillar tracks let them cross barbed wire."},
  {id:"q14", chapterId:5, prompt:"Which countries were the Central Powers?", options:["France, Britain, Russia","Germany, Austria-Hungary, Ottoman Empire, Bulgaria","Germany, Italy, Japan","Austria-Hungary, Serbia, Bulgaria"], correct:1, explain:"Germany, Austria-Hungary and the Ottoman Empire, joined by Bulgaria, were the Central Powers."},
  {id:"q15", chapterId:5, prompt:"What was the Gallipoli campaign (April 1915)?", options:["A German victory in France","A disastrous Allied landing near Constantinople","A naval battle in the North Sea","A Russian offensive"], correct:1, explain:"The Allies landed at Gallipoli to open a Balkan front; it was a disaster and they withdrew."},
  {id:"q16", chapterId:5, prompt:"Who urged Arab princes to revolt against the Ottomans in 1917?", options:["Lawrence of Arabia","Woodrow Wilson","Leon Trotsky","Lloyd George"], correct:0, explain:"British officer T. E. Lawrence, 'Lawrence of Arabia', encouraged the Arab revolt."},
  {id:"q17", chapterId:6, prompt:"When was the Lusitania sunk?", options:["7 May 1915","28 June 1914","31 May 1916","6 April 1917"], correct:0, explain:"A German submarine sank the Lusitania on 7 May 1915; about 1,100 civilians, including over 100 Americans, died."},
  {id:"q18", chapterId:6, prompt:"What was the immediate cause of US entry into the war in April 1917?", options:["The assassination in Sarajevo","Germany's return to unrestricted submarine warfare","The Russian Revolution","The Battle of Verdun"], correct:1, explain:"Germany resumed unrestricted submarine warfare in January 1917, bringing the US into the war in April 1917."},
  {id:"q19", chapterId:6, prompt:"The Battle of Jutland (1916) was...", options:["A decisive German victory on land","The only direct naval battle between Germany and Britain, with no conclusive winner","The first tank battle","An Ottoman victory"], correct:1, explain:"Jutland (31 May 1916) was the only direct naval battle between Germany and Britain; neither side won conclusively."},
  {id:"q20", chapterId:7, prompt:"What is 'total war'?", options:["A war on every continent","A war involving the complete mobilization of resources and people","A war without rules","A war fought only by professional soldiers"], correct:1, explain:"Total war means the complete mobilization of resources and people, affecting all citizens."},
  {id:"q21", chapterId:7, prompt:"What was DORA in Britain?", options:["A battleship","The Defence of the Realm Act, allowing arrests of protesters and censorship","A women's union","A propaganda poster"], correct:1, explain:"The Defence of the Realm Act let the British government arrest protesters as traitors and censor newspapers."},
  {id:"q22", chapterId:7, prompt:"What lasting gain did many women obtain right after the war?", options:["Equal wages","The right to vote (Germany, Austria, USA; British women over 30)","Permanent industrial jobs","Military service"], correct:1, explain:"Jobs were mostly temporary, but women gained the vote in Germany, Austria and the US, and British women over 30."},
  {id:"q23", chapterId:8, prompt:"What did the women of Petrograd demand on 8 March 1917?", options:["'All Power to the Soviets'","'Peace and Bread'","'Land and Liberty'","'Long live the Czar'"], correct:1, explain:"About 10,000 women marched demanding 'Peace and Bread' and 'Down with Autocracy'."},
  {id:"q24", chapterId:8, prompt:"Who influenced Czarina Alexandra and was murdered in December 1916?", options:["Kerensky","Rasputin","Lenin","Trotsky"], correct:1, explain:"Grigory Rasputin gained Alexandra's trust through her hemophiliac son Alexis; aristocrats killed him in December 1916."},
  {id:"q25", chapterId:8, prompt:"What was the provisional government's major blunder?", options:["Releasing Lenin","Continuing the war","Abolishing the Duma","Signing Brest-Litovsk"], correct:1, explain:"Kerensky's provisional government decided to carry on the war — it satisfied neither workers nor peasants."},
  {id:"q26", chapterId:8, prompt:"What were the soviets?", options:["Councils of workers' and soldiers' representatives","Czarist ministers","Secret police units","Foreign armies"], correct:0, explain:"Soviets were councils of workers and soldiers, largely socialist, that challenged the provisional government."},
  {id:"q27", chapterId:9, prompt:"Why did the Germans send Lenin back to Russia in April 1917?", options:["To negotiate peace","To create disorder in Russia","To arrest him","To help the czar"], correct:1, explain:"German leaders shipped Lenin in a sealed train, hoping to create disorder in Russia."},
  {id:"q28", chapterId:9, prompt:"What were the Bolshevik slogans?", options:["'Liberty, Equality, Fraternity'","'Peace, Land, Bread', 'Worker Control of Production', 'All Power to the Soviets'","'Blood and Iron'","'Make Germany pay'"], correct:1, explain:"Three slogans summed up the Bolshevik program: 'Peace, Land, Bread', 'Worker Control of Production' and 'All Power to the Soviets'."},
  {id:"q29", chapterId:9, prompt:"What did Russia give up in the Treaty of Brest-Litovsk (3 March 1918)?", options:["Siberia","Eastern Poland, Ukraine, Finland and the Baltic provinces","Moscow","Its navy only"], correct:1, explain:"Lenin gave up eastern Poland, Ukraine, Finland and the Baltic provinces to obtain peace with Germany."},
  {id:"q30", chapterId:10, prompt:"Which is NOT a reason for the Red victory in the civil war?", options:["The discipline of the Red Army under Trotsky","The disunity of the Whites","Massive military help from the Allies to the Reds","Patriotism against foreign troops"], correct:2, explain:"The Allies helped the Whites, not the Reds — and their presence actually boosted Russian patriotism for the Communists."},
  {id:"q31", chapterId:10, prompt:"What was the Cheka?", options:["The Red secret police","A White general","A peace treaty","A Bolshevik newspaper"], correct:0, explain:"The Cheka, the Red secret police, led the Red Terror against opponents of the regime."},
  {id:"q32", chapterId:11, prompt:"Which date did Ludendorff call 'the black day of the German army'?", options:["18 July 1918","8 August 1918","29 September 1918","11 November 1918"], correct:1, explain:"Ludendorff wrote that 8 August 1918 was 'the black day of the German army'."},
  {id:"q33", chapterId:11, prompt:"Where did German sailors mutiny on 3 November 1918?", options:["Berlin","Munich","Kiel","Hamburg"], correct:2, explain:"Sailors mutinied in Kiel on 3 November 1918, sparking councils of workers and soldiers across northern Germany."},
  {id:"q34", chapterId:11, prompt:"When was the armistice signed?", options:["9 November 1918","11 November 1918","28 June 1919","3 March 1918"], correct:1, explain:"The new German republic signed the armistice on 11 November 1918."},
  {id:"q35", chapterId:12, prompt:"Who were the 'Big Three' at the Paris Peace Conference?", options:["Wilson, Clemenceau, Lloyd George","Wilson, Lenin, Clemenceau","Lloyd George, Orlando, Ebert","William II, Nicholas II, Wilson"], correct:0, explain:"Wilson (USA), Clemenceau (France) and Lloyd George (Britain) made the key decisions; Orlando (Italy) completed the Big Four."},
  {id:"q36", chapterId:12, prompt:"What was France's (Clemenceau's) main goal?", options:["Free trade","National security and revenge against Germany","Creating the League of Nations first","Helping Russia"], correct:1, explain:"Clemenceau wanted security: Germany disarmed, heavy reparations and a separate Rhineland buffer state."},
  {id:"q37", chapterId:12, prompt:"Which is one of Wilson's Fourteen Points?", options:["Secret diplomacy","Self-determination of peoples","Annexation of colonies","Rearmament"], correct:1, explain:"Wilson called for open diplomacy, disarmament, free trade, freedom of the seas and self-determination."},
  {id:"q38", chapterId:13, prompt:"According to the 'Consequences' document, about how many people died in WWI?", options:["About 2 million","About 10 million","About 19 million","About 60 million"], correct:2, explain:"About 19 million dead, almost half of them civilians (the textbook gives 'nearly 10 million', mainly soldiers)."},
  {id:"q39", chapterId:13, prompt:"Who were the 'gueules cassées'?", options:["Deserters","Soldiers with facial injuries","Spanish flu victims","Russian revolutionaries"], correct:1, explain:"The 'gueules cassées' were invalids with facial injuries among the more than 21 million wounded."},
  {id:"q40", chapterId:13, prompt:"To which country were European states heavily indebted after the war?", options:["Germany","Russia","The United States","Japan"], correct:2, explain:"The war was a financial disaster: European states were heavily indebted, especially to the United States."},

// syncStatus: "off" (par défaut, rien démarré) · "checking" (en cours
// d'activation) · "synced" (compte Claude, via la capacité db) · "local"
// (capacité indisponible ou artefact ouvert hors d'une session Claude).
let syncStatus = "off";
let dbCap = null;
let progressDocRef = null;
let dbReady = false;
let dbSaveTimer = null;

function normalizeProgress(data){
  return {
    chapterScores: (data && typeof data.chapterScores==="object" && data.chapterScores) || {},
    cardBox: (data && typeof data.cardBox==="object" && data.cardBox) || {},
    questionsAsked: (data && typeof data.questionsAsked==="number") ? data.questionsAsked : 0,
    lastExam: (data && data.lastExam) || null
  };
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ progress = normalizeProgress(JSON.parse(raw)); }
  }catch(e){
    // localStorage unavailable (private browsing, restricted iframe...) — session stays in memory only
    console.warn("Progress could not be loaded, starting fresh:", e);
  }
}
function saveProgressLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    console.warn("Progress could not be saved for this session:", e);
  }
}
function saveProgress(){
  saveProgressLocal();
  scheduleRemoteSave();
}
function scheduleRemoteSave(){
  if(!dbReady || !progressDocRef) return;
  clearTimeout(dbSaveTimer);
  dbSaveTimer = setTimeout(()=>{
    progressDocRef.set(progress).catch(e=>{
      console.warn("Progress could not be synced to your Claude account:", e);
    });
  }, 600);
}

// Attempts to attach this page's progress to the viewer's Claude account via
// the `db` capability, so it survives across browsers/devices instead of
// staying stuck in this one browser's localStorage. If the capability isn't
// granted here (older viewer, or the page opened outside claude.ai), the
// app keeps working exactly as before, on localStorage alone.
// Only ever called from an explicit click (the "Activer la synchronisation"
// button) — never automatically on load — so any first-use permission
// prompt the capability shows happens on purpose, not silently in the
// middle of a quiz.
async function initRemoteProgress(){
  if(syncStatus==="checking" || syncStatus==="synced") return;
  syncStatus = "checking";
  if(state.tab==="accueil") render();
  try{
    dbCap = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null;
  }catch(e){ dbCap = null; }
  if(!dbCap){
    syncStatus = "local";
    if(state.tab==="accueil") render();
    return;
  }
  try{
    progressDocRef = dbCap.doc("progress/main");
    const snap = await progressDocRef.get();
    if(snap.exists){
      progress = normalizeProgress(snap.data());
      saveProgressLocal(); // mirror locally too, as an offline fallback
    } else {
      // First time this account opens the page: seed the account-wide
      // store from whatever was already sitting in this browser.
      await progressDocRef.set(progress);
    }
    dbReady = true;
    syncStatus = "synced";
    progressDocRef.onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites) return; // ignore echo of our own pending write
      progress = normalizeProgress(snap.data());
      saveProgressLocal();
      if(state.tab==="accueil") render();
    }, e=>{
      console.warn("Progress sync interrupted, staying on the local copy:", e);
    });
  }catch(e){
    console.warn("Progress DB unavailable, staying on localStorage:", e);
    syncStatus = "local";
  }
  if(state.tab==="accueil") render();
}

function chapterMastery(chId){
  const s = progress.chapterScores[chId];
  if(!s || s.total===0) return 0;
  return Math.round((s.correct/s.total)*100);
}
function overallMastery(){
  let c=0,t=0;
  Object.values(progress.chapterScores).forEach(s=>{c+=s.correct;t+=s.total;});
  return t===0?0:Math.round((c/t)*100);
}
function cardsAcquiredCount(){
  return CARDS.filter(c=> (progress.cardBox[c.id]||1) >= 4).length;
}
function registerAnswer(chapterId, isCorrect){
  if(!progress.chapterScores[chapterId]) progress.chapterScores[chapterId]={correct:0,total:0};
  progress.chapterScores[chapterId].total++;
  if(isCorrect) progress.chapterScores[chapterId].correct++;
  progress.questionsAsked++;
  saveProgress();
}

/* ---- Fiches (flashcards, spaced repetition) ---- */

function ensureFlashOrder(){
  if(flashState.order.length===0){
    flashState.order = CARDS.map(c=>c.id).sort((a,b)=>{
      const la=(progress.cardBox[a]||1), lb=(progress.cardBox[b]||1);
      if(la!==lb) return la-lb;
      return Math.random()-0.5;
    });
    flashState.idx = 0;
    flashState.flipped = false;
  }
}
function renderFiches(){
  ensureFlashOrder();
  if(flashState.idx >= flashState.order.length){
    return `<div class="flash-empty"><h3 style="font-family:var(--serif);">Série terminée !</h3><p>Toutes les fiches de cette session ont été vues.</p><button class="btn primary" id="btnRestartFlash">Recommencer une série</button></div>`;
  }
  const card = CARDS.find(c=>c.id===flashState.order[flashState.idx]);
  const box = progress.cardBox[card.id]||1;
  const ch = CHAPTERS.find(c=>c.id===card.chapterId);
  return `
  <div class="flash-wrap">
    <div class="flash-meta"><span>VOCABULAIRE · ${ch.title.toUpperCase()}</span><span>Boîte ${box}/5 · ${flashState.idx+1}/${flashState.order.length}</span></div>
    <div class="flashcard">
      <div class="term">${card.en}</div>
      ${flashState.flipped? `<div class="def">${card.fr}</div>` : `<button class="btn" id="btnFlip">Voir la réponse</button>`}
    </div>
    ${flashState.flipped? `
    <div class="rate-row">
      <button class="btn bad" id="btnBad">À revoir</button>
      <button class="btn good" id="btnGood">Je savais</button>
    </div>` : `<div style="text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;">Essaie de traduire avant de révéler la réponse.</div>`}
  </div>`;
}
function wireFiches(){
  const flip = document.getElementById("btnFlip");
  if(flip) flip.onclick = ()=>{ flashState.flipped=true; renderInto(); };
  const restart = document.getElementById("btnRestartFlash");
  if(restart) restart.onclick = ()=>{ flashState.order=[]; render(); };
  const good = document.getElementById("btnGood");
  const bad = document.getElementById("btnBad");
  function advance(delta){
    const cardId = flashState.order[flashState.idx];
    const cur = progress.cardBox[cardId]||1;
    progress.cardBox[cardId] = delta>0? Math.min(5,cur+1) : 1;
    saveProgress();
    flashState.idx++; flashState.flipped=false;
    render();
  }
  if(good) good.onclick = ()=>advance(1);
  if(bad) bad.onclick = ()=>advance(-1);
}
function renderInto(){
  // lightweight re-render of just entrainement body without losing subnav wiring issues
  render();
}

/* ---- Quiz par chapitre ---- */

function renderQuizChapitrePicker(){
  return `<div class="card">
    <h3>Choisis un chapitre</h3>
    <div class="hint">2 questions par chapitre, correction immédiate.</div>
    ${CHAPTERS.map(c=>{
      const qCount = QUESTIONS.filter(q=>q.chapterId===c.id).length;
      return `<div class="chapter-row"><span class="num">${c.id}</span><span class="name">${c.title}</span>
        <button class="btn small" data-pick="${c.id}">Réviser (${qCount})</button></div>`;
    }).join("")}

}
function wireQuizChapitrePicker(){
  document.querySelectorAll("button[data-pick]").forEach(b=>{
    b.onclick = ()=>{
      const chId = parseInt(b.dataset.pick);
      startQuiz("chapter", chId);

}

/* ---- Generic live quiz (used by chapter quiz & révision express) ---- */

function startQuiz(mode, chapterId){
  let list;
  if(mode==="chapter"){
    list = QUESTIONS.filter(q=>q.chapterId===chapterId);
  } else { // express
    list = [...QUESTIONS].sort(()=>Math.random()-0.5).slice(0,12);
  }
  quizState = {mode, list, idx:0, selected:null, submittedOne:false, score:0};
}

function renderQuizLive(){
  if(!quizState) return `<div class="card">Choisis un mode de quiz.</div>`;
  if(quizState.idx >= quizState.list.length){
    return `<div class="quiz-wrap"><div class="exam-result">
      <div class="score">${quizState.score}/${quizState.list.length}</div>
      <div style="color:var(--muted);margin-top:8px;">Bien joué. Continue avec un autre chapitre ou la révision express.</div>
      <button class="btn primary" style="margin-top:16px;" id="btnQuizDone">Retour</button>
    </div></div>`;
  }
  const q = quizState.list[quizState.idx];
  return `
  <div class="quiz-wrap">
    <div class="quiz-progress">Question ${quizState.idx+1} / ${quizState.list.length} ${quizState.mode==='express'?'· Révision express':''}</div>
    <div class="quiz-card">
      <div class="qtext">${q.prompt}</div>
      ${q.options.map((opt,i)=>{
        let cls="opt";
        if(quizState.submittedOne){
          if(i===q.correct) cls+=" correct";
          else if(i===quizState.selected) cls+=" incorrect";
        }
        return `<button class="${cls}" data-opt="${i}" ${quizState.submittedOne?'disabled':''}>${opt}</button>`;
      }).join("")}
      ${quizState.submittedOne? `<div class="feedback ${quizState.selected===q.correct?'ok':'ko'}">${quizState.selected===q.correct?'Correct — ':'Pas tout à fait — '}${q.explain}</div>`:""}
      ${quizState.submittedOne? `<div class="quiz-footer"><button class="btn primary" id="btnNextQ">${quizState.idx+1<quizState.list.length?'Question suivante':'Voir le score'}</button></div>`:""}
    </div>
  </div>`;
}
function wireQuizLive(){
  document.querySelectorAll(".opt[data-opt]").forEach(b=>{
    b.onclick = ()=>{
      if(quizState.submittedOne) return;
      const i = parseInt(b.dataset.opt);
      quizState.selected = i;
      quizState.submittedOne = true;
      const q = quizState.list[quizState.idx];
      const isCorrect = i===q.correct;
      if(isCorrect) quizState.score++;
      registerAnswer(q.chapterId, isCorrect);
      render();
    };
  });
  const next = document.getElementById("btnNextQ");
  if(next) next.onclick = ()=>{
    quizState.idx++; quizState.selected=null; quizState.submittedOne=false;
    render();
  };
  const done = document.getElementById("btnQuizDone");
  if(done) done.onclick = ()=>{ quizState=null; state.entSub="quiz-chapitre"; render(); };
}

/* ---- Pièges ---- */

      <div class="trap-grid">

/* ---- Lexique FR-EN ---- */

function renderLexique(){
  return `
    <input class="lex-search" id="lexSearch" placeholder="Chercher un terme (anglais ou français)...">
    <table class="vocab-table" id="lexTable">
      <tr><th>ANGLAIS</th><th>FRANÇAIS</th><th>CHAPITRE</th></tr>
      ${lexRows(CARDS)}
    </table>
  `;
}
function lexRows(list){
  return [...list].sort((a,b)=>a.en.localeCompare(b.en)).map(c=>{
    const ch = CHAPTERS.find(x=>x.id===c.chapterId);
    return `<tr><td class="en">${c.en}</td><td>${c.fr}</td><td style="color:var(--muted);">${ch.id}. ${ch.title}</td></tr>`;
  }).join("");
}
function wireLexique(){
  const input = document.getElementById("lexSearch");
  if(!input) return;
  input.oninput = ()=>{
    const v = input.value.toLowerCase();
    const filtered = CARDS.filter(c=> c.en.toLowerCase().includes(v) || c.fr.toLowerCase().includes(v));
    document.getElementById("lexTable").innerHTML = `<tr><th>ANGLAIS</th><th>FRANÇAIS</th><th>CHAPITRE</th></tr>${lexRows(filtered)}`;
  };
}

/* ============================= RENDER: FRISES ============================= */

  {id:"chrono", label:"Frise chronologique"},
  {id:"alliances", label:"Les deux camps"}
];

function renderFrises(){

function wireFrises(){
  document.querySelectorAll(".subnav button[data-fsub]").forEach(b=>{
    b.onclick = ()=>{ state.frisesSub=b.dataset.fsub; render(); };
  });
  document.querySelectorAll(".t-item").forEach(el=>{
    el.onclick = ()=>{ el.classList.toggle("open"); };
  });
}
function renderChrono(){
  return `<div class="card"><h3>1882 → 1923</h3><div class="hint">Clique sur une date pour déplier le résumé.</div>
    <div class="timeline">
      ${TIMELINE.map((t,i)=>`<div class="t-item" data-i="${i}">
        <div class="yr">${t.yr}</div>
        <div class="ttl">${t.ttl}</div>
        <div class="body">${t.body}</div>
      </div>`).join("")}

}
function renderAlliancesView(){
  return `<div class="card">
    <h3>Qui combattait contre qui ?</h3>
    <div class="hint">Avant-guerre : Triple Entente vs Triple Alliance. Pendant la guerre : Alliés vs puissances centrales.</div>
    <div class="alliance-grid">
      <div class="alliance-col entente">
        <h4>Allied Powers (Alliés)</h4>
        <div class="sub">la Triple Entente et ses alliés</div>
        ${ALLIANCES.entente.map(c=>`<span class="chip">${c}</span>`).join("")}
      </div>
      <div class="alliance-col triplice">

        <div style="margin-top:10px;">${ALLIANCES.centrales_annexes.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
      </div>
    </div>
    <div class="callout">⚠️ Deux changements à retenir : l'Italie, membre de la Triple Alliance (1882), attaque l'Autriche en mai 1915 et passe chez les Alliés. La Russie, elle, quitte la guerre avec le traité de Brest-Litovsk (3 mars 1918).</div>
  </div>`;

/* ============================= RENDER: EXAMEN BLANC ============================= */

let examState = null; // {answers:{}, submitted:false, secondsLeft, timerId, list}

function renderExamen(){
  if(!examState){
    return `<div class="card" style="max-width:640px;">
      <div class="kicker">CONDITIONS DU TEST</div>
      <h3 style="font-size:24px;">Examen blanc — 20 questions, 30 minutes</h3>
      <p style="color:var(--muted);">Aucun indice, aucune correction avant la fin. Le mélange couvre les deux parties : le déroulement de la guerre et de la révolution russe, puis les conséquences et les traités. Prends une feuille si tu veux noter tes raisonnements.</p>
      <div class="btnrow">
        <button class="btn primary" id="btnStartTimed">Démarrer le chronomètre</button>
        <button class="btn" id="btnStartUntimed">Sans chronomètre</button>
      </div>
    </div>`;
  }
  if(examState.submitted){
    let score=0;
    examState.list.forEach(q=>{ if(examState.answers[q.id]===q.correct) score++; });
    return `<div class="quiz-wrap">
      <div class="exam-result">
        <div class="score">${score}/${examState.list.length}</div>
        <div style="color:var(--muted);margin-top:8px;">${score>=examState.list.length*0.8?'Excellent niveau !':score>=examState.list.length*0.6?'Bonne base, revois les points faibles ci-dessous.':"Retourne réviser les chapitres où tu t'es trompé."}</div>
        <button class="btn primary" style="margin-top:16px;" id="btnExamRestart">Refaire un examen blanc</button>
      </div>
      ${examState.list.map((q,i)=>{
        const given = examState.answers[q.id];
        const ok = given===q.correct;
        return `<div class="exam-item">
          <div class="qtext">${i+1}. ${q.prompt}</div>
          ${q.options.map((opt,oi)=>{
            let cls="opt";
            if(oi===q.correct) cls+=" correct"; else if(oi===given) cls+=" incorrect";
            return `<div class="${cls}">${opt}</div>`;
          }).join("")}
          <div class="feedback ${ok?'ok':'ko'}">${ok?'Correct — ':'Faux — '}${q.explain}</div>
        </div>`;
      }).join("")}
    </div>`;
  }
  const mm = String(Math.floor(examState.secondsLeft/60)).padStart(2,"0");
  const ss = String(examState.secondsLeft%60).padStart(2,"0");
  return `<div class="quiz-wrap">
    ${examState.timed? `<div class="exam-header"><div>Examen blanc — ${examState.list.length} questions</div><div class="timer ${examState.secondsLeft<180?'low':''}">${mm}:${ss}</div></div>`
      : `<div class="exam-header"><div>Examen blanc — ${examState.list.length} questions</div><div style="color:var(--muted);font-size:13px;">Sans chronomètre</div></div>`}
    ${examState.list.map((q,i)=>`
      <div class="exam-item">
        <div class="qtext">${i+1}. ${q.prompt}</div>
        ${q.options.map((opt,oi)=>`
          <label><input type="radio" name="exq-${q.id}" value="${oi}" ${examState.answers[q.id]===oi?'checked':''}> ${opt}</label>
        `).join("")}
      </div>
    `).join("")}
    <button class="btn primary" id="btnSubmitExam" style="width:100%;padding:16px;font-size:15px;">Soumettre l'examen</button>
  </div>`;
}

function wireExamen(){
  const startTimed = document.getElementById("btnStartTimed");
  const startUntimed = document.getElementById("btnStartUntimed");
  if(startTimed) startTimed.onclick = ()=> beginExam(true);
  if(startUntimed) startUntimed.onclick = ()=> beginExam(false);

  document.querySelectorAll('.exam-item input[type=radio]').forEach(r=>{
    r.onchange = ()=>{
      const qid = r.name.replace("exq-","");
      examState.answers[qid] = parseInt(r.value);
    };
  });
  const submit = document.getElementById("btnSubmitExam");
  if(submit) submit.onclick = ()=> finishExam();
  const restart = document.getElementById("btnExamRestart");
  if(restart) restart.onclick = ()=>{ examState=null; render(); };
}
function beginExam(timed){
  const list = EXAM_IDS.map(id=>QUESTIONS.find(q=>q.id===id));
  examState = {answers:{}, submitted:false, secondsLeft:1800, timed, list, timerId:null};
  if(timed){
    examState.timerId = setInterval(()=>{
      examState.secondsLeft--;
      if(examState.secondsLeft<=0){ clearInterval(examState.timerId); finishExam(); }
      else { const el=document.querySelector('.exam-header .timer'); if(el){ const mm=String(Math.floor(examState.secondsLeft/60)).padStart(2,"0"); const ss=String(examState.secondsLeft%60).padStart(2,"0"); el.textContent=mm+":"+ss; if(examState.secondsLeft<180) el.classList.add('low'); } }
    },1000);
  }
  render();
}
function finishExam(){
  if(examState.timerId) clearInterval(examState.timerId);
  examState.submitted = true;
  let score=0;
  examState.list.forEach(q=>{
    const given = examState.answers[q.id];
    const ok = given===q.correct;
    if(ok) score++;
    registerAnswer(q.chapterId, ok);
  });
  progress.lastExam = {score, total:examState.list.length, date:new Date().toLocaleDateString('fr-CH')};
  saveProgress();
  render();
}

/* ============================= MAIN RENDER ============================= */

function render(){
  try{
    renderNav();
    const app = document.getElementById("app");
    if(state.tab==="accueil"){ app.innerHTML = renderAccueil(); wireAccueil(); }
    else if(state.tab==="cours"){ app.innerHTML = renderCours(); wireCours(); }
    else if(state.tab==="entrainement"){ app.innerHTML = renderEntrainement(); wireEntrainement(); wireLexique(); }
    else if(state.tab==="frises"){ app.innerHTML = renderFrises(); wireFrises(); }
    else if(state.tab==="examen"){ app.innerHTML = renderExamen(); wireExamen(); }
    const fab = document.getElementById("fabBtn");
    if(fab) fab.style.display = (state.tab==="accueil")? "none":"block";
  }catch(err){
    console.error("Render error:", err);
    const app = document.getElementById("app");
    if(app){
      app.innerHTML = `<div class="card"><h3>Un souci d'affichage est survenu</h3>
        <p style="color:var(--muted);">Réessaie, ou reviens à l'accueil.</p>
        <button class="btn primary" id="btnRecover">Retour à l'accueil</button></div>`;
      const rec = document.getElementById("btnRecover");
      if(rec) rec.onclick = ()=>{ state.tab="accueil"; quizState=null; examState=null; render(); };
    }
  }
}

/* ============================= INIT ============================= */

(function init(){
  loadProgress();
  render();
})();

</script>
